<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pomodoro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    .container {
      height: 100%;
      width: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 0 16px 36px 16px;
    }
    .main-section {
      width: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
    }

    /* 顶部昼夜天象 */
    .sky-badge {
      width: 64px;
      height: 64px;
      position: relative;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .sun-box {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
    }
    .sun-rays {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-transition: none;
      transition: none;
    }
    .sun-face {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin-top: -16px;
      margin-left: -16px;
      background: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 50%;
      box-sizing: border-box;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }
    .moon-box {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
    }
    .moon-star {
      position: absolute;
      top: 12px;
      right: 8px;
      width: 18px;
      height: 18px;
      -webkit-transition: none;
      transition: none;
    }

    /* 倒计时展示容器（点击切换字体，等比自然放大） */
    .timer-container {
      width: 100%;
      height: 150px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 24px;
      cursor: pointer;
    }

    /* 常规文本字形 */
    .timer-text {
      font-size: 145px;
      line-height: 1;
      text-align: center;
      display: none;
    }

    /* 字体 0: 柔和胶囊圆角体 */
    .font-style-0 {
      font-family: "Avenir Next Rounded Pro", "Varela Round", "Nunito", "Arial Rounded MT Bold", sans-serif;
      font-weight: 300;
      letter-spacing: 0px;
    }

    /* 字体 1: 极简超细极幼体 */
    .font-style-1 {
      font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif;
      font-weight: 200;
      letter-spacing: -2px;
    }

    /* 字体 2: 优雅古典细体 */
    .font-style-2 {
      font-family: "Baskerville", "Garamond", "Georgia", serif;
      font-weight: 300;
      letter-spacing: 2px;
    }

    /* 字体 3: 复古等宽打字机体 */
    .font-style-3 {
      font-family: "Courier New", "Menlo", "Lucida Console", monospace;
      font-weight: 900;
      letter-spacing: 4px;
    }

    /* 字体 4: 七段数码管液晶结构 (7-Segment) */
    .timer-segment {
      display: none;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      height: 130px;
      gap: 6px;
    }
    .timer-segment svg {
      height: 120px;
      width: auto;
    }
    .seg-colon {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      gap: 18px;
      margin: 0 4px;
    }
    .seg-colon span {
      width: 10px;
      height: 10px;
      background: #000000;
      border-radius: 1px;
    }

    /* 脚印全幅进度滑槽 */
    .tracks-container {
      width: 90%;
      height: 32px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 12px;
    }
    .track-slot {
      width: 22px;
      height: 22px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }
    .track-slot svg {
      width: 20px;
      height: 20px;
      fill: #000000;
      display: none;
    }
    .track-slot:nth-child(even) svg {
      margin-top: 5px;
      -webkit-transform: rotate(6deg);
      transform: rotate(6deg);
    }
    .track-slot:nth-child(odd) svg {
      margin-top: -5px;
      -webkit-transform: rotate(-6deg);
      transform: rotate(-6deg);
    }
    .track-slot.active svg {
      display: block;
    }

    .footer {
      width: 100%;
      text-align: center;
    }
    .btn-row {
      margin-bottom: 24px;
    }
    button {
      background: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      background: #000000;
      color: #ffffff;
    }
    .btn-adjust {
      font-size: 24px;
      padding: 8px 24px;
      margin: 0 10px;
    }
    .btn-start {
      font-size: 34px;
      padding: 14px 64px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="main-section">
      
      <!-- 顶部昼夜天象（点击可手动切换） -->
      <div class="sky-badge" onclick="toggleManualSky()">
        <!-- 太阳 -->
        <div class="sun-box" id="sun-box">
          <div class="sun-rays" id="sun-rays">
            <svg viewBox="0 0 100 100" stroke="#000" stroke-linecap="round">
              <path d="M50 4 L50 16" stroke-width="4.5"/>
              <path d="M50 84 L50 96" stroke-width="4.5"/>
              <path d="M4 50 L16 50" stroke-width="4.5"/>
              <path d="M84 50 L96 50" stroke-width="4.5"/>
              <path d="M17 17 L26 26" stroke-width="4"/>
              <path d="M74 74 L83 83" stroke-width="4"/>
              <path d="M17 83 L26 74" stroke-width="4"/>
              <path d="M74 26 L83 17" stroke-width="4"/>
            </svg>
          </div>
          <div class="sun-face">
            <svg viewBox="0 0 34 34">
              <circle cx="12" cy="14" r="1.8" fill="#000"/>
              <circle cx="22" cy="14" r="1.8" fill="#000"/>
              <path d="M12 19 Q 17 24 22 19" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- 月亮 -->
        <div class="moon-box" id="moon-box">
          <svg viewBox="0 0 68 68" style="width:100%;height:100%;">
            <path d="M38 12 C24 12 12 24 12 38 C12 48 18 56 26 59 C23 54 22 48 22 42 C22 28 32 17 46 16 C43 13 40 12 38 12 Z" fill="#000"/>
          </svg>
          <div class="moon-star" id="moon-star">
            <svg viewBox="0 0 24 24">
              <path d="M12 2 Q 12 12 2 12 Q 12 12 12 22 Q 12 12 22 12 Q 12 12 12 2 Z" fill="#000"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 倒计时区域（点击任意位置即可循环切换 5 套字体） -->
      <div class="timer-container" onclick="switchFont()">
        <!-- 常规文本字体容器 -->
        <div class="timer-text" id="timer-text">00:25</div>

        <!-- 七段数码管液晶容器 -->
        <div class="timer-segment" id="timer-segment">
          <svg id="seg-d0" viewBox="0 0 54 90"></svg>
          <svg id="seg-d1" viewBox="0 0 54 90"></svg>
          <div class="seg-colon"><span></span><span></span></div>
          <svg id="seg-d2" viewBox="0 0 54 90"></svg>
          <svg id="seg-d3" viewBox="0 0 54 90"></svg>
        </div>
      </div>
      
      <!-- 脚印全幅进度滑槽（未开始前保持隐藏） -->
      <div class="tracks-container" id="tracks-bottom">
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
        <div class="track-slot"></div>
      </div>
    </div>

    <div class="footer">
      <div class="btn-row">
        <button class="btn-adjust" onclick="addMinutes(5)">+5m</button>
        <button class="btn-adjust" onclick="addMinutes(10)">+10m</button>
      </div>
      <div>
        <button id="btn-toggle" class="btn-start" onclick="toggleTimer()">开始</button>
      </div>
    </div>
  </div>

  <script>
    var ANIMALS = [
      // 1. 猫科 4 趾
      {
        name: 'cat',
        feetCount: 4,
        svg: '<svg viewBox="0 0 24 24"><ellipse cx="9" cy="12" rx="4.5" ry="5.5"/><circle cx="16" cy="7" r="2"/><circle cx="19" cy="12" r="2.2"/><circle cx="16" cy="17" r="2"/></svg>'
      },
      // 2. 胖偶蹄（小猪/小牛）
      {
        name: 'pig_hoof',
        feetCount: 4,
        svg: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="7.5" rx="6" ry="3.2" transform="rotate(10 12 7.5)" fill="#000"/><ellipse cx="12" cy="16.5" rx="6" ry="3.2" transform="rotate(-10 12 16.5)" fill="#000"/></svg>'
      },
      // 3. 奇蹄（马蹄铁）
      {
        name: 'horse_hoof',
        feetCount: 4,
        svg: '<svg viewBox="0 0 24 24"><path d="M5 6 C15 5 19 9 19 12 C19 15 15 19 5 18 L5 14.5 C12 15 14 13.5 14 12 C14 10.5 12 9 5 9.5 Z" fill="#000"/></svg>'
      },
      // 4. 细鸟爪（小鸡/麻雀）
      {
        name: 'bird',
        feetCount: 2,
        svg: '<svg viewBox="0 0 24 24"><path d="M5 12 L19 12 M13 12 L19 6 M13 12 L19 18" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      },
      // 5. 鸭鹅蹼
      {
        name: 'duck',
        feetCount: 2,
        svg: '<svg viewBox="0 0 24 24"><path d="M4 12 L9 12 M9 12 L17 4 C14 8 13 10 9 12 C13 14 14 16 17 20 Z" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#000"/></svg>'
      }
    ];

    // 七段数码管每个段的几何多边形
    var SEG_PATHS = {
      a: '<polygon points="6,6 12,2 42,2 48,6 42,10 12,10" fill="#000"/>',
      b: '<polygon points="48,6 52,12 52,40 48,44 44,40 44,12" fill="#000"/>',
      c: '<polygon points="48,46 52,50 52,80 48,84 44,80 44,50" fill="#000"/>',
      d: '<polygon points="6,84 12,88 42,88 48,84 42,80 12,80" fill="#000"/>',
      e: '<polygon points="6,46 10,50 10,80 6,84 2,80 2,50" fill="#000"/>',
      f: '<polygon points="6,6 10,12 10,40 6,44 2,40 2,12" fill="#000"/>',
      g: '<polygon points="6,45 12,41 42,41 48,45 42,49 12,49" fill="#000"/>'
    };

    // 0~9 对应的段亮起表
    var DIGIT_MAP = {
      '0': ['a','b','c','d','e','f'],
      '1': ['b','c'],
      '2': ['a','b','g','e','d'],
      '3': ['a','b','g','c','d'],
      '4': ['f','g','b','c'],
      '5': ['a','f','g','c','d'],
      '6': ['a','f','e','d','c','g'],
      '7': ['a','b','c'],
      '8': ['a','b','c','d','e','f','g'],
      '9': ['a','b','c','d','f','g']
    };

    var totalTime = 25 * 60;
    var timeLeft = totalTime;
    var timerId = null;
    var hasStarted = false;

    var isDayTime = true;
    var sunAngle = 0;
    var starToggled = false;

    var currentAnimal = null;
    var TOTAL_SLOTS = 12;
    var SKY_INTERVAL = 2;

    var currentFontIndex = 0;
    var TOTAL_FONTS = 5; // 0:圆角, 1:极细, 2:古典, 3:复古等宽, 4:七段数码管

    var timerTextEl = document.getElementById('timer-text');
    var timerSegmentEl = document.getElementById('timer-segment');
    var toggleBtn = document.getElementById('btn-toggle');
    var sunBoxEl = document.getElementById('sun-box');
    var moonBoxEl = document.getElementById('moon-box');
    var sunRaysEl = document.getElementById('sun-rays');
    var moonStarEl = document.getElementById('moon-star');
    var trackSlots = document.querySelectorAll('.track-slot');

    function initSavedFont() {
      var saved = localStorage.getItem('kindle_pomodoro_font');
      if (saved !== null) {
        currentFontIndex = parseInt(saved, 10) || 0;
        if (currentFontIndex >= TOTAL_FONTS) {
          currentFontIndex = 0;
        }
      }
      applyFont();
    }

    function switchFont() {
      currentFontIndex = (currentFontIndex + 1) % TOTAL_FONTS;
      try {
        localStorage.setItem('kindle_pomodoro_font', currentFontIndex);
      } catch(e) {}
      applyFont();
      updateDisplay();
    }

    function applyFont() {
      if (currentFontIndex === 4) {
        // 模式 4：显示七段数码管
        timerTextEl.style.display = 'none';
        timerSegmentEl.style.display = '-webkit-flex';
        timerSegmentEl.style.display = 'flex';
      } else {
        // 模式 0~3：显示等比放大文本字体
        timerSegmentEl.style.display = 'none';
        timerTextEl.style.display = 'block';
        timerTextEl.className = 'timer-text font-style-' + currentFontIndex;
      }
    }

    function getLocalHour() {
      var d = new Date();
      var tzOffset = d.getTimezoneOffset();
      if (tzOffset === 0) {
        return (d.getUTCHours() + 8) % 24;
      }
      return d.getHours();
    }

    function updateDayNightMode() {
      var hour = getLocalHour();
      isDayTime = (hour >= 6 && hour < 18);
      renderSkyIcon();
    }

    function renderSkyIcon() {
      if (isDayTime) {
        sunBoxEl.style.display = 'block';
        moonBoxEl.style.display = 'none';
      } else {
        sunBoxEl.style.display = 'none';
        moonBoxEl.style.display = 'block';
      }
    }

    function toggleManualSky() {
      isDayTime = !isDayTime;
      renderSkyIcon();
    }

    function clearTracks() {
      for (var i = 0; i < TOTAL_SLOTS; i++) {
        trackSlots[i].innerHTML = '';
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = false;
    }

    function startAnimalTracks() {
      var randIndex = Math.floor(Math.random() * ANIMALS.length);
      currentAnimal = ANIMALS[randIndex];
      for (var i = 0; i < TOTAL_SLOTS; i++) {
        trackSlots[i].innerHTML = currentAnimal.svg;
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = true;
      updateProgressTracks();
    }

    function updateProgressTracks() {
      if (!hasStarted || !currentAnimal) {
        return;
      }

      var progressRatio = (totalTime - timeLeft) / totalTime;
      var leadIndex = Math.min(TOTAL_SLOTS - 1, Math.floor(progressRatio * TOTAL_SLOTS));
      var count = currentAnimal.feetCount;

      for (var i = 0; i < TOTAL_SLOTS; i++) {
        trackSlots[i].className = 'track-slot';
      }

      for (var k = 0; k < count; k++) {
        var pos = leadIndex - k;
        if (pos >= 0 && pos < TOTAL_SLOTS) {
          trackSlots[pos].className = 'track-slot active';
        }
      }
    }

    function tickSkyBadge() {
      if (isDayTime) {
        sunAngle = (sunAngle + 15) % 360;
        sunRaysEl.style.webkitTransform = 'rotate(' + sunAngle + 'deg)';
        sunRaysEl.style.transform = 'rotate(' + sunAngle + 'deg)';
      } else {
        starToggled = !starToggled;
        var starAngle = starToggled ? 20 : 0;
        moonStarEl.style.webkitTransform = 'rotate(' + starAngle + 'deg)';
        moonStarEl.style.transform = 'rotate(' + starAngle + 'deg)';
      }
    }

    function formatTimeStrings(seconds) {
      var totalMinutes = Math.ceil(seconds / 60);
      if (totalMinutes <= 0) return ['00', '00'];

      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;

      var strH = (hours < 10 ? '0' : '') + hours;
      var strM = (mins < 10 ? '0' : '') + mins;
      return [strH, strM];
    }

    function renderSegmentDigit(svgId, char) {
      var el = document.getElementById(svgId);
      if (!el) return;
      var segs = DIGIT_MAP[char] || [];
      var html = '';
      for (var i = 0; i < segs.length; i++) {
        html += SEG_PATHS[segs[i]];
      }
      el.innerHTML = html;
    }

    function updateDisplay() {
      var parts = formatTimeStrings(timeLeft);
      var timeStr = parts[0] + ':' + parts[1];

      if (currentFontIndex === 4) {
        renderSegmentDigit('seg-d0', parts[0].charAt(0));
        renderSegmentDigit('seg-d1', parts[0].charAt(1));
        renderSegmentDigit('seg-d2', parts[1].charAt(0));
        renderSegmentDigit('seg-d3', parts[1].charAt(1));
      } else {
        timerTextEl.innerText = timeStr;
      }

      updateProgressTracks();
    }

    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.innerText = '开始';
      } else {
        if (timeLeft <= 0 || !hasStarted) {
          timeLeft = totalTime;
          startAnimalTracks();
        }
        updateDayNightMode();
        timerId = setInterval(tick, 1000);
        toggleBtn.innerText = '暂停';
      }
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;

        var elapsed = totalTime - timeLeft;

        if (elapsed % SKY_INTERVAL === 0) {
          tickSkyBadge();
        }

        updateProgressTracks();

        if (timeLeft % 60 === 0 || timeLeft === 0) {
          updateDisplay();
        }
      } else {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.innerText = '开始';
        timeLeft = totalTime;
        clearTracks();
        updateDisplay();
      }
    }

    function addMinutes(mins) {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.innerText = '开始';
      }

      var currentMins = Math.round(totalTime / 60);
      currentMins += mins;

      if (currentMins > 120) {
        currentMins = 5;
      }

      totalTime = currentMins * 60;
      timeLeft = totalTime;
      clearTracks();
      updateDayNightMode();
      updateDisplay();
    }

    // 初始化
    initSavedFont();
    updateDayNightMode();
    clearTracks();
    updateDisplay();
  </script>
</body>
</html>
