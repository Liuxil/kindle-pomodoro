<!DOCTYPE html>
<!-- 特别感谢 ZYI 提供 Kindle Paperwhite 11代 的真机测试，帮助定位并修复了像素时钟在高分辨率设备上的显示问题 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Pomodoro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      overflow: hidden !important;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

    #screen-bounds {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden !important;
    }

    #app-container {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      max-width: 100%; max-height: 100%;
      -webkit-transform: translate(-50%, -50%) rotate(90deg);
      transform: translate(-50%, -50%) rotate(90deg);
      display: -webkit-box; display: flex;
      -webkit-box-orient: vertical; flex-direction: column;
      -webkit-box-pack: justify; justify-content: space-between;
      -webkit-box-align: center; align-items: center;
      padding: 12px 8px;
    }

    .sky-badge { width: 60px; height: 60px; position: relative; cursor: pointer; flex-shrink: 0; }
    .sun-box, .moon-box { width: 100%; height: 100%; position: relative; display: none; }
    .sun-rays { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .main-section {
      width: 100%; -webkit-box-flex: 1; flex: 1;
      display: -webkit-box; display: flex;
      -webkit-box-orient: vertical; flex-direction: column;
      -webkit-box-align: center; align-items: center;
      -webkit-box-pack: center; justify-content: center;
    }
    .timer-container {
      width: 100%; cursor: pointer;
      display: -webkit-box; display: flex;
      -webkit-box-orient: horizontal; -webkit-box-direction: normal;
      -webkit-box-pack: center; justify-content: center;
      -webkit-box-align: center; align-items: center;
    }
    
    .timer-text {
      font-size: 210px;
      line-height: 1;
      margin: -10px 0; 
      text-align: center;
      width: 100%;
      display: block;
      letter-spacing: -6px;
      white-space: nowrap;
    }

    .font-style-0 { font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif; font-weight: 200; color: transparent !important; -webkit-text-fill-color: transparent !important; -webkit-text-stroke: 1.5px #000000; }
    .font-style-1 { font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif; font-weight: 200; color: #000000 !important; -webkit-text-fill-color: #000000 !important; -webkit-text-stroke: 0 !important; }
    .font-style-2 { color: #000000; -webkit-text-fill-color: #000000; -webkit-text-stroke: 0; }

    /* 像素时钟：4个数字槽 + 1个冒号横排；每个槽里预先摆好0-9共10个静态字形，
       只用class切换显示哪一个，完全不在运行时生成/插入SVG，兼容老内核 */
    .pixel-timer {
      display: none;
      -webkit-box-orient: horizontal; -webkit-box-direction: normal;
      -webkit-box-align: center; align-items: center;
      -webkit-box-pack: center; justify-content: center;
      width: 100%;
    }
    .pixel-timer.active { display: -webkit-box; display: flex; }
    .pixel-digit-slot { position: relative; flex-shrink: 0; -webkit-box-flex: 0; }
    .pixel-digit { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .pixel-digit.active { display: block; }
    .pixel-colon { position: relative; flex-shrink: 0; -webkit-box-flex: 0; }

    .tracks-container {
      width: 96%; height: 26px; margin-top: 10px;
      display: -webkit-box; display: flex;
      -webkit-box-orient: horizontal; -webkit-box-direction: normal;
      -webkit-box-pack: justify; justify-content: space-between;
      -webkit-box-align: center; align-items: center;
    }
    .track-slot { width: 20px; height: 20px; display: -webkit-box; display: flex; -webkit-box-orient: horizontal; -webkit-box-direction: normal; -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center; }
    .track-slot svg { width: 18px; height: 18px; fill: #000000; display: none; }
    .track-slot:nth-child(even) svg { margin-top: 4px; -webkit-transform: rotate(6deg); transform: rotate(6deg); }
    .track-slot:nth-child(odd) svg { margin-top: -4px; -webkit-transform: rotate(-6deg); transform: rotate(-6deg); }
    .track-slot.active svg { display: block; }

    .footer {
      width: 94%; flex-shrink: 0;
      display: -webkit-box; display: flex;
      -webkit-box-orient: horizontal; -webkit-box-direction: normal;
      -webkit-box-pack: justify; justify-content: space-between;
      -webkit-box-align: center; align-items: center;
    }
    .btn-adjust-group { display: -webkit-box; display: flex; -webkit-box-orient: horizontal; -webkit-box-direction: normal; gap: 10px; }
    button {
      background: #ffffff; color: #000000; border: 3px solid #000000; font-weight: bold; border-radius: 8px; cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #000000; color: #ffffff; }
    button:focus { outline: none; }
    button::-moz-focus-inner { border: 0; }
    .btn-adjust { font-size: 18px; padding: 5px 14px; }
    
    .btn-start {
      background: transparent !important; border: none !important; padding: 5px; width: 72px; height: 72px;
      display: -webkit-box; display: flex; -webkit-box-orient: horizontal; -webkit-box-direction: normal; -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center;
    }
    .btn-start:active { background: transparent !important; color: #000000 !important; opacity: 0.4; }
    .btn-start svg { width: 42px; height: 42px; }

    .btn-reset {
      background: transparent !important; border: none !important; padding: 5px; width: 72px; height: 72px;
      display: -webkit-box; display: flex; -webkit-box-orient: horizontal; -webkit-box-direction: normal; -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center;
    }
    .btn-reset:active { background: transparent !important; opacity: 0.4; }
    .btn-reset svg { width: 41px; height: 37px; }

    .rest-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 100; cursor: pointer;
      -webkit-box-orient: horizontal; -webkit-box-direction: normal;
      -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center;
    }
    .rest-screen.active { display: -webkit-box; display: flex; }
    .rest-panel { display: none; width: 100%; height: 100%; -webkit-box-orient: horizontal; -webkit-box-direction: normal; -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center; }
    .rest-panel.active { display: -webkit-box; display: flex; }
    
    /* 统一的动画舞台样式 */
    .pixel-stage { width: 280px; height: 280px; position: relative; }
    .anim-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .anim-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .anim-frame.active { display: block; }
    
    .pixel-cat-stage { width: 280px; height: 280px; position: relative; }
    .cat-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .cat-frame.active { display: block; }

    .standby-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 90; cursor: pointer;
      -webkit-box-orient: vertical; flex-direction: column;
      -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center;
    }
    .standby-screen.active { display: -webkit-box; display: flex; }
  </style>
</head>

    function setPixelDigit(slotEl, digitChar) {

    var K_SCALE = 1;
    var REFERENCE_SHORT = 600; // Kindle 7代短边参考值(CSS像素)，缩放系数以此为基准换算

    function updateScaleFactor() {
      var raw = SCREEN_SHORT / REFERENCE_SHORT;
      if (!isFinite(raw) || raw <= 0) raw = 1;
      // 限制在合理范围内，避免极端测量值把画面缩得没法看或者撑爆屏幕
      K_SCALE = Math.max(0.5, Math.min(4, raw));
      applyScaleStyles();
    }

    function applyScaleStyles() {
      var s = K_SCALE;
      // 直接拼出算好的字面量像素值，不用CSS自定义属性(var())——
      // Kindle 7代这类老WebKit不认识var()，整条声明会被判定无效直接丢弃，
      // 用普通的、写死数值的CSS文本才能保证在老浏览器上正常生效
      var css = ''
        + '#app-container{padding:' + (12*s) + 'px ' + (8*s) + 'px;}'
        + '.sky-badge{width:' + (60*s) + 'px;height:' + (60*s) + 'px;}'
        + '.timer-text{font-size:' + (210*s) + 'px;margin:' + (-10*s) + 'px 0;letter-spacing:' + (-6*s) + 'px;}'
        + '.font-style-0{-webkit-text-stroke-width:' + (1.5*s) + 'px;}'
        + '.tracks-container{height:' + (26*s) + 'px;margin-top:' + (10*s) + 'px;}'
        + '.track-slot{width:' + (20*s) + 'px;height:' + (20*s) + 'px;}'
        + '.track-slot svg{width:' + (18*s) + 'px;height:' + (18*s) + 'px;}'
        + '.track-slot:nth-child(even) svg{margin-top:' + (4*s) + 'px;}'
        + '.track-slot:nth-child(odd) svg{margin-top:' + (-4*s) + 'px;}'
        + '.btn-adjust-group{gap:' + (10*s) + 'px;}'
        + 'button{border-width:' + (3*s) + 'px;border-radius:' + (8*s) + 'px;}'
        + '.btn-adjust{font-size:' + (18*s) + 'px;padding:' + (5*s) + 'px ' + (14*s) + 'px;}'
        + '.btn-start{padding:' + (5*s) + 'px;width:' + (72*s) + 'px;height:' + (72*s) + 'px;}'
        + '.btn-start svg{width:' + (42*s) + 'px;height:' + (42*s) + 'px;}'
        + '.btn-reset{padding:' + (5*s) + 'px;width:' + (72*s) + 'px;height:' + (72*s) + 'px;}'
        + '.btn-reset svg{width:' + (41*s) + 'px;height:' + (37*s) + 'px;}'
        + '.pixel-stage{width:' + (280*s) + 'px;height:' + (280*s) + 'px;}'
        + '.pixel-cat-stage{width:' + (280*s) + 'px;height:' + (280*s) + 'px;}';

      var styleEl = document.getElementById('k-scale-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'k-scale-style';
        document.getElementsByTagName('head')[0].appendChild(styleEl);
      }
      // 用最传统的DOM API写文本内容(而不是textContent/innerHTML)，兼容性最保险
      while (styleEl.firstChild) { styleEl.removeChild(styleEl.firstChild); }
      styleEl.appendChild(document.createTextNode(css));
    }

    function init() {
      var w = document.documentElement.clientWidth || window.innerWidth;
      var h = document.documentElement.clientHeight || window.innerHeight;
      SCREEN_LONG = Math.max(w, h);
      SCREEN_SHORT = Math.min(w, h);
      updateScaleFactor();

      initDOM();
      initSavedSettings();
      updateDayNightMode();
      clearTracks();
      updateDisplay();
      bindEvents();
      resetIdleTimer();
    }

    function initDOM() {
      var slotsHtml = '';
      for (var i = 0; i < TOTAL_SLOTS; i++) { slotsHtml += '<div class="track-slot"></div>'; }
      els.tracksBottom.innerHTML = slotsHtml;
      trackSlots = els.tracksBottom.querySelectorAll('.track-slot');

      els.birdFrames = document.getElementById('stage-bird-coffee').querySelectorAll('.anim-frame');

      els.butterflyFrames = document.getElementById('butterfly-layer').querySelectorAll('.anim-frame');

      els.btnToggle.innerHTML = ICON_PLAY;
    }

    function bindEvents() {
      document.getElementById('btn-orientation').addEventListener('click', toggleOrientation);
      document.getElementById('btn-font-switch').addEventListener('click', switchFont);
      
      els.btnToggle.addEventListener('click', function(e) {
        if (e) e.preventDefault();
        toggleTimer();
        this.blur();
      });
      els.restScreen.addEventListener('click', hideRestScreen);
      
      var adjustBtns = document.querySelectorAll('.btn-adjust');
      for (var m = 0; m < adjustBtns.length; m++) {
        adjustBtns[m].addEventListener('click', function(e) {
          addMinutes(parseInt(e.target.getAttribute('data-adj'), 10));
          e.target.blur();
        });
      }

      els.btnReset.addEventListener('click', function (e) {
        if (e) e.preventDefault();
        resetTimer();
        this.blur();
      });

      els.standbyScreen.addEventListener('click', hideStandbyScreen);
      document.addEventListener('click', resetIdleTimer, true);
    }

    function handleEasterEgg(action) {
      if (action === 'FONT') {
        if (easterEggStep === 0 || easterEggStep === 1) { easterEggStep++; } else { easterEggStep = 2; }
      } else if (action === '+10') {
        if (easterEggStep === 2) { easterEggStep = 3; } else if (easterEggStep === 3) { easterEggStep = 4; } else { easterEggStep = 0; }
      } else if (action === '+5') {
        if (easterEggStep === 4) { easterEggStep = 5; } else if (easterEggStep === 6) { easterEggStep = 7; } else { easterEggStep = 0; }
      } else if (action === '-5') {
        if (easterEggStep === 5) { easterEggStep = 6; } else if (easterEggStep === 7) { easterEggStep = 0; return true; } else { easterEggStep = 0; }
      } else {
        easterEggStep = 0;
      }
      return false;
    }

    // 像素时钟的精确布局计算：直接用目标高度反推每个数字槽该有的px宽度(=高度×6/8)，
    // 冒号宽度(=高度×2/8)，彻底避免"宽度用百分比写死、高度用em算"这种两套单位互相
    // 掐架导致的瓶颈问题——之前不管怎么调高度比例都没用，就是因为宽度百分比是
    // 独立写死的，实际显示大小从头到尾都被宽度卡住了，跟高度设多少完全无关。
    function layoutPixelTimer(fontSizePx, containerWidthPx) {
      var TARGET_RATIO = 0.71; // 用fontTools实测Helvetica系字体数字高度/字号的比例
      var GLYPH_ASPECT = 6 / 8; // 数字字形本身的宽高比
      var GAP_RATIO = 0.12; // 数字间距，相对高度的比例

      var h = fontSizePx * TARGET_RATIO;
      var digitW = h * GLYPH_ASPECT;
      var colonW = h * (1 / 8); // 冒号viewBox宽度从2改成了1(单像素点)，这里同步更新比例
      var gap = h * GAP_RATIO;

      // 4个数字槽+1个冒号，共5个元素、4个间隙
      var totalW = digitW * 4 + colonW + gap * 4;
      var maxW = containerWidthPx * 0.9; // 留10%安全余量，绝不会顶到屏幕边缘
      if (totalW > maxW) {
        var scale = maxW / totalW;
        h *= scale; digitW *= scale; colonW *= scale; gap *= scale;
      }

      els.pixelTimer.style.height = h + 'px';
      // 像素字形是贴边绘制的，没有文字天然带的下方留白(descender空间)，
      // 不补一个下边距的话，脚印进度条会显得贴得特别近
      els.pixelTimer.style.marginBottom = (h * 0.15) + 'px';
      for (var i = 0; i < els.digitSlots.length; i++) {
        els.digitSlots[i].style.width = digitW + 'px';
        els.digitSlots[i].style.height = h + 'px';
        els.digitSlots[i].style.margin = '0 ' + (gap / 2) + 'px';
      }
      if (els.pixelColon) {
        els.pixelColon.style.width = colonW + 'px';
        els.pixelColon.style.height = h + 'px';
        els.pixelColon.style.margin = '0 ' + (gap / 2) + 'px';
      }
    }

    function applyOrientationLogic() {
      // 安全内边距按K_SCALE缩放，保证这圈边距在所有分辨率设备上占屏幕的比例一致，
      // 而不是固定8px在高分辨率屏幕上显得"占比更小"、不同机型看起来不一样
      var SAFE_INSET = Math.round(8 * K_SCALE);
      var SAFE_LONG = (SCREEN_LONG - SAFE_INSET) & ~1;
      var SAFE_SHORT = (SCREEN_SHORT - SAFE_INSET) & ~1;

      if (isPortraitMode) {
        els.appContainer.style.width = SAFE_SHORT + 'px';
        els.appContainer.style.height = SAFE_LONG + 'px';
        els.appContainer.style.webkitTransform = 'translate(-50%, -50%)';
        els.appContainer.style.transform = 'translate(-50%, -50%)';
        els.timerText.style.fontSize = (215 * K_SCALE) + 'px';
        els.timerText.style.margin = (-10 * K_SCALE) + 'px 0';
        layoutPixelTimer(215 * K_SCALE, SAFE_SHORT);
        // 竖屏下重置按钮贴屏幕左边缘太近了，往右(中间方向)挪一点，横屏不受影响
        els.btnReset.style.marginLeft = (16 * K_SCALE) + 'px';
      } else {
        els.appContainer.style.width = SAFE_LONG + 'px';
        els.appContainer.style.height = SAFE_SHORT + 'px';
        els.appContainer.style.webkitTransform = 'translate(-50%, -50%) rotate(90deg)';
        els.appContainer.style.transform = 'translate(-50%, -50%) rotate(90deg)';
        els.timerText.style.fontSize = (250 * K_SCALE) + 'px';
        els.timerText.style.margin = (-15 * K_SCALE) + 'px 0';
        layoutPixelTimer(250 * K_SCALE, SAFE_LONG);
        els.btnReset.style.marginLeft = '0px';
      }
      forceLayoutRecalc();
    }

    function forceLayoutRecalc() {
      window.scrollTo(0, 1);
      window.scrollTo(0, 0);
      void document.body.offsetHeight;
    }

    function toggleOrientation() {
      isPortraitMode = !isPortraitMode;
      try { localStorage.setItem('kindle_pomodoro_orient', isPortraitMode ? 'portrait' : 'landscape'); } catch (e) {}
      applyOrientationLogic();
    }

    function initSavedSettings() {
      // 横竖屏模式跟字体一样做记忆：读得到就用上次保存的，读不到(第一次打开)才用默认横屏
      isPortraitMode = false;
      try {
        var savedOrient = localStorage.getItem('kindle_pomodoro_orient');
        if (savedOrient === 'portrait') { isPortraitMode = true; }
      } catch (e) {}
      applyOrientationLogic();
      try {
        var savedFont = localStorage.getItem('kindle_pomodoro_font');
        if (savedFont !== null) { currentFontIndex = parseInt(savedFont, 10) % TOTAL_FONTS || 0; }
      } catch (e) {}
      applyFont();
    }

    function switchFont() {
      currentFontIndex = (currentFontIndex + 1) % TOTAL_FONTS;
      try { localStorage.setItem('kindle_pomodoro_font', currentFontIndex); } catch(e) {}
      applyFont();
      handleEasterEgg('FONT');
    }

    function applyFont() {
      els.timerText.className = 'timer-text font-style-' + currentFontIndex;
      // 第三种字体(像素数字)用的是单独的静态DOM结构，跟文字版的timer-text互斥显示。
      // pixel-timer的flex布局需要-webkit-box前缀兜底老内核，所以用class切换而不是
      // 内联style直接写display:flex(那样会丢掉CSS里已经写好的-webkit-box兜底)
      els.timerText.style.display = (currentFontIndex === 2) ? 'none' : 'block';
      els.pixelTimer.className = (currentFontIndex === 2) ? 'pixel-timer active' : 'pixel-timer';
      // 字体类型切换了，纯文字/像素SVG的渲染方式不一样，光换className内容不会自动更新，
      // 强制让updateDisplay()按"内容变了"重新渲染一次
      lastDisplayedText = '';
      updateDisplay();
    }

    function toggleTimer() {
      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      } else { 
        if (timeLeft <= 0 || !hasStarted) {
          timeLeft = totalTime;
          hasRefreshedThisRun = false; // 新一轮倒计时开始，重置"是否已强刷过"标记
          startAnimalTracks();
        }
        updateDayNightMode();
        targetEndTime = new Date().getTime() + (timeLeft * 1000);
        timerId = setInterval(tick, 1000);
        els.btnToggle.innerHTML = ICON_PAUSE;
      }
    }

    function tick() {
      var now = new Date().getTime();
      var newTimeLeft = Math.max(0, Math.ceil((targetEndTime - now) / 1000));
      
      if (newTimeLeft !== timeLeft) { 
        var elapsedSeconds = totalTime - newTimeLeft;
        timeLeft = newTimeLeft;

        if (elapsedSeconds % SKY_INTERVAL === 0) tickSkyBadge();
        updateDisplay();

        // 开始运行满1分钟(累计实际运行时长，暂停期间不计入)时强刷一次，
        // 整个倒计时只刷这一次；误触开始后1分钟内就暂停/结束的话，不会触发这次刷新
        if (!hasRefreshedThisRun && elapsedSeconds >= FIRST_REFRESH_DELAY_SEC) {
          hasRefreshedThisRun = true;
          forceScreenRefresh();
        }

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          els.btnToggle.innerHTML = ICON_PLAY;
          timeLeft = totalTime;
          clearTracks();
          updateDisplay();
          showRestScreen();
        }
      }
    }

    function addMinutes(mins) {
      var actionStr = (mins > 0 ? '+' : '') + mins;
      var isEggTriggered = handleEasterEgg(actionStr);

      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      }
      
      var currentMins = Math.round(totalTime / 60) + mins;
      if (currentMins > 120) { currentMins = 5; } else if (currentMins < 5) { currentMins = 120; }
      
      totalTime = currentMins * 60;
      timeLeft = totalTime;
      clearTracks();
      updateDayNightMode();
      updateDisplay();

      if (isEggTriggered) showRestScreen();
    }

    function updateDisplay() {
      var totalMinutes = Math.ceil(timeLeft / 60);
      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;
      
      var strH = (hours < 10 ? '0' : '') + hours;
      var strM = (mins < 10 ? '0' : '') + mins;
      var newText = strH + ':' + strM;

      if (newText !== lastDisplayedText) {
        if (currentFontIndex === 2) {
          setPixelDigit(els.digitSlots[0], strH.charAt(0));
          setPixelDigit(els.digitSlots[1], strH.charAt(1));
          setPixelDigit(els.digitSlots[2], strM.charAt(0));
          setPixelDigit(els.digitSlots[3], strM.charAt(1));
        } else {
          els.timerText.innerText = newText;
        }
        lastDisplayedText = newText;
      }
      
      if (!hasStarted || !currentAnimal || isResetting) return; // 重置动效期间脚印由animateFootprintRetreat单独控制
      var progressRatio = (totalTime - timeLeft) / totalTime;
      var leadIndex = Math.min(TOTAL_SLOTS - 1, Math.floor(progressRatio * TOTAL_SLOTS));

      if (leadIndex === lastLeadIndex) return;
      lastLeadIndex = leadIndex;
      paintTracks(leadIndex);
    }

    // 按leadIndex点亮脚印，从updateDisplay里抽出来，方便重置的倒退动画复用
    function paintTracks(leadIndex) {
      var count = currentAnimal ? currentAnimal.feetCount : 1;
      for (var i = 0; i < trackSlots.length; i++) { trackSlots[i].className = 'track-slot'; }
      for (var k = 0; k < count; k++) {
        var pos = leadIndex - k;
        if (pos >= 0 && pos < TOTAL_SLOTS) { trackSlots[pos].className = 'track-slot active'; }
      }
    }

    function forceScreenRefresh() {
      document.body.style.backgroundColor = '#000000';
      setTimeout(function() { document.body.style.backgroundColor = '#ffffff'; }, 120);
    }

    function updateDayNightMode() {
      var d = new Date();
      var tzOffset = d.getTimezoneOffset();
      var hour = tzOffset === 0 ? (d.getUTCHours() + 8) % 24 : d.getHours();
      isDayTime = (hour >= 6 && hour < 18);
      els.sunBox.style.display = isDayTime ? 'block' : 'none';
      els.moonBox.style.display = isDayTime ? 'none' : 'block';
    }

    function tickSkyBadge() {
      starToggled = !starToggled;
      if (isDayTime) {
        if (els.sunRaysExt) { els.sunRaysExt.style.display = starToggled ? 'block' : 'none'; }
      } else {
        if (els.moonStars1 && els.moonStars2) {
          els.moonStars1.style.display = starToggled ? 'block' : 'none';
          els.moonStars2.style.display = starToggled ? 'none' : 'block';
        }
      }
    }

    function startAnimalTracks() {
      var randIndex = Math.floor(Math.random() * ANIMALS.length);
      currentAnimal = ANIMALS[randIndex];
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = currentAnimal.svg;
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = true;
      lastLeadIndex = -1;
      updateFooterState();
      updateDisplay();
    }

    function clearTracks() {
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = '';
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = false;
      lastLeadIndex = -1;
      updateFooterState();
    }

    function updateFooterState() {
      if (hasStarted) {
        els.adjustGroup.style.display = 'none';
        els.btnReset.style.display = '-webkit-box';
        els.btnReset.style.display = 'flex';
      } else {
        els.adjustGroup.style.display = '-webkit-box';
        els.adjustGroup.style.display = 'flex';
        els.btnReset.style.display = 'none';
      }
    }

    var isResetting = false;
    var FLICKER_COUNT = 4;
    var FLICKER_INTERVAL_MS = 120;

    function resetTimer() {
      if (isResetting) return; // 动画播放中，避免连续点击触发重叠的动画
      if (timerId) { clearInterval(timerId); timerId = null; }
      isResetting = true;

      // 乱码闪烁式的重置动效：固定闪烁4次(每次随机数字)，不管设定时长多大
      // 动画节奏都一样。纯视觉层面，闪烁过程中的timeLeft都是假的随机值，
      // 最后一帧才落回真实的totalTime。脚印倒退动画跟数字闪烁并行播放。
      animateResetGlitch(function () {
        timeLeft = totalTime;
        els.btnToggle.innerHTML = ICON_PLAY;
        clearTracks(); // 内部会把hasStarted设为false、并调用updateFooterState()切回调整时长组
        updateDisplay();
        isResetting = false;
      });
      animateFootprintRetreat();
    }

    function animateResetGlitch(onDone) {
      var i = 0;
      function nextFlicker() {
        if (i < FLICKER_COUNT) {
          var randomMinutes = Math.floor(Math.random() * 200);
          timeLeft = randomMinutes * 60;
          updateDisplay();
          i++;
          setTimeout(nextFlicker, FLICKER_INTERVAL_MS);
        } else {
          onDone();
        }
      }
      nextFlicker();
    }

    // 脚印倒退动画：固定从最右端(TOTAL_SLOTS-1)横扫到最左端(-1)，
    // 每次重置都是横跨全程的完整播片效果，跟数字闪烁同样的节奏
    function animateFootprintRetreat() {
      if (!hasStarted || !currentAnimal) return;
      var startIndex = TOTAL_SLOTS - 1;

      var steps = FLICKER_COUNT;
      var i = 0;
      function nextStep() {
        if (i < steps) {
          var fraction = (i + 1) / steps;
          var leadIndex = Math.round(startIndex - (startIndex + 1) * fraction);
          paintTracks(leadIndex); // fraction=1时leadIndex精确等于-1，天然清空所有格子
          i++;
          setTimeout(nextStep, FLICKER_INTERVAL_MS);
        }
      }
      nextStep();
    }

    function showRestScreen() {
      restAnimState.index = Math.floor(Math.random() * els.restPanels.length);
      updateActiveRestPanel();
      els.restScreen.className = 'rest-screen active';
      forceScreenRefresh();

      if (restAnimState.timer) clearInterval(restAnimState.timer);
      restAnimState.timer = setInterval(animateRestPanel, REST_ANIM_INTERVALS[restAnimState.index]);
    }

    function hideRestScreen(e) {
      if (e) e.stopPropagation();
      els.restScreen.className = 'rest-screen';
      forceScreenRefresh();
      if (restAnimState.timer) clearInterval(restAnimState.timer);
    }

    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        if (!hasStarted && els.restScreen.className.indexOf('active') === -1 && els.standbyScreen.className.indexOf('active') === -1) {
          showStandbyScreen();
        }
      }, IDLE_TIMEOUT_MS);
    }

    function showStandbyScreen() {
      standbyCatStep = 0;
      els.standbyCats[0].className = 'cat-frame active';
      els.standbyCats[1].className = 'cat-frame';
      els.standbyScreen.className = 'standby-screen active';
      forceScreenRefresh();

      if (standbyAnimTimer) clearInterval(standbyAnimTimer);
      standbyAnimTimer = setInterval(function() {
        standbyCatStep = 1 - standbyCatStep;
        els.standbyCats[0].className = standbyCatStep === 0 ? 'cat-frame active' : 'cat-frame';
        els.standbyCats[1].className = standbyCatStep === 1 ? 'cat-frame active' : 'cat-frame';
      }, 1800); 
    }

    function hideStandbyScreen(e) {
      if (e) e.stopPropagation();
      els.standbyScreen.className = 'standby-screen';
      if (standbyAnimTimer) { clearInterval(standbyAnimTimer); standbyAnimTimer = null; }
      forceScreenRefresh();
      resetIdleTimer();
    }

    function updateActiveRestPanel() {
      for (var i = 0; i < els.restPanels.length; i++) {
        els.restPanels[i].className = (i === restAnimState.index) ? 'rest-panel active' : 'rest-panel';
      }
    }

    // 核心动画控制器
    function animateRestPanel() {
      if (els.restScreen.className.indexOf('active') === -1) return;

      var idx = restAnimState.index;
      if (idx === 0) {
        // 小鸟深蹲与热气交替 (4帧循环: 0-1-2-3)
        els.birdFrames[restAnimState.birdStep].className = 'anim-frame';
        restAnimState.birdStep = (restAnimState.birdStep + 1) % 4;
        els.birdFrames[restAnimState.birdStep].className = 'anim-frame active';
      } else if (idx === 1) {
        // 蝴蝶透视形变(16帧) 与 慢摇波浪花丛(8帧)
        els.butterflyFrames[restAnimState.comboStep % 16].className = 'anim-frame';
        els.flowerFrames[Math.floor(restAnimState.comboStep / 4) % 8].className = 'anim-frame';
        
        restAnimState.comboStep++;
        if (restAnimState.comboStep >= 3200) restAnimState.comboStep = 0;
        
        els.butterflyFrames[restAnimState.comboStep % 16].className = 'anim-frame active';
        els.flowerFrames[Math.floor(restAnimState.comboStep / 4) % 8].className = 'anim-frame active';
      } else if (idx === 2) {
        // 像素猫咪 (2帧)
        restAnimState.catStep = 1 - restAnimState.catStep;
        els.cats[0].className = restAnimState.catStep === 0 ? 'cat-frame active' : 'cat-frame';
        els.cats[1].className = restAnimState.catStep === 1 ? 'cat-frame active' : 'cat-frame';
      }
    }

    window.addEventListener('load', function() {
        setTimeout(init, 50);
        setTimeout(function() {
          var w = document.documentElement.clientWidth || window.innerWidth;
          var h = document.documentElement.clientHeight || window.innerHeight;
          SCREEN_LONG = Math.max(w, h);
          SCREEN_SHORT = Math.min(w, h);
          updateScaleFactor();
          applyOrientationLogic();
        }, 300);
    });

  </script>
</body>
</html>
