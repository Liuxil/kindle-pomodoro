<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pomodoro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    .container {
      height: 100%;
      width: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 20px;
    }
    .timer {
      font-size: 110px;
      font-weight: 900;
      font-family: monospace, sans-serif;
      line-height: 1;
      text-align: center;
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 82%;
      height: 16px;
      border: 3px solid #000000;
      padding: 2px;
      margin-bottom: 70px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #000000;
    }
    .footer {
      width: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      gap: 28px;
    }
    .btn-row {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      gap: 36px;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }
    button {
      background: #ffffff;
      color: #000000;
      border: 3px solid #000000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      background: #000000;
      color: #ffffff;
    }
    .btn-adjust {
      font-size: 24px;
      padding: 10px 28px;
    }
    .btn-start {
      font-size: 28px;
      padding: 14px 44px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="timer" id="timer-display">00:25</div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="footer">
      <div class="btn-row">
        <button class="btn-adjust" onclick="addMinutes(5)">+5m</button>
        <button class="btn-adjust" onclick="addMinutes(10)">+10m</button>
      </div>
      <button id="btn-toggle" class="btn-start" onclick="toggleTimer()">开始</button>
    </div>
  </div>

  <script>
    var totalTime = 25 * 60;
    var timeLeft = totalTime;
    var timerId = null;

    var timerEl = document.getElementById('timer-display');
    var progressEl = document.getElementById('progress-bar');
    var toggleBtn = document.getElementById('btn-toggle');

    function formatTime(seconds) {
      var totalMinutes = Math.ceil(seconds / 60);
      if (totalMinutes <= 0) return '00:00';

      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;

      var strH = (hours < 10 ? '0' : '') + hours;
      var strM = (mins < 10 ? '0' : '') + mins;
      return strH + ':' + strM;
    }

    function updateDisplay() {
      timerEl.innerText = formatTime(timeLeft);
      var progressPercent = ((totalTime - timeLeft) / totalTime) * 100;
      progressEl.style.width = progressPercent + '%';
    }

    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.innerText = '开始';
      } else {
        if (timeLeft <= 0) {
          timeLeft = totalTime;
        }
        timerId = setInterval(tick, 1000);
        toggleBtn.innerText = '暂停';
      }
    }

    function tick() {
      if (timeLeft > 0) {
        timeLeft--;
        if (timeLeft % 60 === 0 || timeLeft === 0) {
          updateDisplay();
        }
      } else {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.innerText = '开始';
        timeLeft = totalTime;
        updateDisplay();
      }
    }

    function addMinutes(mins) {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        toggleBtn.innerText = '开始';
      }

      var currentMins = Math.round(totalTime / 60);
      currentMins += mins;

      if (currentMins > 120) {
        currentMins = 5;
      }

      totalTime = currentMins * 60;
      timeLeft = totalTime;
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
