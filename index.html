<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>金梅细圆实机效果测试</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      padding: 16px 12px 40px 12px;
      font-family: sans-serif;
    }
    h1 {
      font-size: 18px;
      text-align: center;
      margin-bottom: 4px;
    }
    p.intro {
      font-size: 12px;
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .test-item {
      border-bottom: 2px solid #000000;
      padding: 14px 0 12px 0;
      text-align: center;
    }
    .label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }
    .desc {
      font-size: 11px;
      color: #555;
      margin-bottom: 8px;
    }

    /* 方案 A: 标准 CSS 调用金梅字体别名 */
    .sample-css {
      font-size: 80px;
      line-height: 1;
      margin: 6px 0;
      font-family: "金梅新细圆", "KingType New Thin Round", "KingNewThinRound", "KingType", "Yuanti SC", "Hiragino Round Gothic Pro", "圆体-简", sans-serif;
      font-weight: 200;
    }

    /* 矢量容器 */
    .svg-box {
      height: 90px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .svg-box svg {
      height: 80px;
      width: 280px;
    }
  </style>
</head>
<body>

  <h1>金梅新细圆风格实机对比</h1>
  <p class="intro">请在 Kindle 上查看以下哪套极细圆角字形最清晰耐看：</p>

  <!-- 1. CSS 直接声明 -->
  <div class="test-item">
    <span class="label">【方案 1】CSS 原生金梅新细圆别名声明</span>
    <div class="desc">依赖系统是否内置该字库，未内置时会回退为默认字体</div>
    <div class="sample-css">00:25</div>
  </div>

  <!-- 2. 矢量仿真：超细圆角（1.5px 极幼圆角） -->
  <div class="test-item">
    <span class="label">【方案 2】矢量仿真 · 超细胶囊圆角（1.5px 线条）</span>
    <div class="desc">纯矢量圆角生成，线条极其纤细，端点柔和圆润</div>
    <div class="svg-box">
      <svg viewBox="0 0 280 80">
        <!-- 0 -->
        <rect x="10" y="5" width="46" height="70" rx="23" ry="23" fill="none" stroke="#000" stroke-width="1.8"/>
        <!-- 0 -->
        <rect x="70" y="5" width="46" height="70" rx="23" ry="23" fill="none" stroke="#000" stroke-width="1.8"/>
        <!-- : -->
        <circle cx="132" cy="28" r="2.5" fill="#000"/>
        <circle cx="132" cy="52" r="2.5" fill="#000"/>
        <!-- 2 -->
        <path d="M 150 25 C 150 8, 190 8, 190 26 C 190 44, 150 54, 150 74 L 192 74" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 5 -->
        <path d="M 248 8 L 214 8 L 210 38 C 215 34, 252 32, 250 58 C 248 76, 212 76, 210 64" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- 3. 矢量仿真：舒展微圆角（2.2px 线条） -->
  <div class="test-item">
    <span class="label">【方案 3】矢量仿真 · 金梅新细圆标准骨架（2.2px 线条）</span>
    <div class="desc">黑度适中，圆角弧度更饱满，墨水屏阅读清晰度最高</div>
    <div class="svg-box">
      <svg viewBox="0 0 280 80">
        <!-- 0 -->
        <rect x="10" y="5" width="46" height="70" rx="23" ry="23" fill="none" stroke="#000" stroke-width="2.4"/>
        <!-- 0 -->
        <rect x="70" y="5" width="46" height="70" rx="23" ry="23" fill="none" stroke="#000" stroke-width="2.4"/>
        <!-- : -->
        <circle cx="132" cy="28" r="3" fill="#000"/>
        <circle cx="132" cy="52" r="3" fill="#000"/>
        <!-- 2 -->
        <path d="M 150 25 C 150 8, 190 8, 190 26 C 190 44, 150 54, 150 74 L 192 74" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 5 -->
        <path d="M 248 8 L 214 8 L 210 38 C 215 34, 252 32, 250 58 C 248 76, 212 76, 210 64" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</body>
</html>
