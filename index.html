<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kindle 庆祝/休息动画预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden !important;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* 全屏点击交互容器 */
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      cursor: pointer;
    }

    /* 顶部微提示 */
    .mode-tip {
      position: absolute;
      top: 14px;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
      border: 1.5px solid #000000;
      padding: 4px 12px;
      border-radius: 6px;
    }

    /* 底部操作提示 */
    .footer-tip {
      position: absolute;
      bottom: 16px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #333333;
    }

    /* 方案展示区域 */
    .view-panel {
      width: 100%;
      height: 75%;
      display: none;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }
    .view-panel.active {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
    }

    /* ================= 方案 1：咖啡杯热气 ================= */
    .coffee-icon {
      width: 160px;
      height: 160px;
    }
    .steam-line {
      -webkit-transition: none;
      transition: none;
    }

    /* ================= 方案 2：双烟花 + 极简碎纸 ================= */
    .firework-svg {
      width: 100%;
      height: 100%;
      max-width: 340px;
      max-height: 480px;
    }

    /* 左上方烟花 (周期 3.6s, 延迟 0s) */
    .fw-1-rocket {
      animation: r1 3.6s steps(4, start) infinite;
    }
    @keyframes r1 {
      0%   { transform: translateY(180px); opacity: 0; }
      12%  { transform: translateY(140px); opacity: 1; }
      32%  { transform: translateY(0px); opacity: 1; }
      40%  { transform: translateY(-25px); opacity: 0; }
      100% { transform: translateY(-25px); opacity: 0; }
    }
    .fw-1-burst {
      transform-origin: 90px 130px;
      animation: b1 3.6s steps(3, start) infinite;
    }
    @keyframes b1 {
      0%, 32% { transform: scale(0.1); opacity: 0; }
      40%     { transform: scale(0.6); opacity: 1; }
      58%     { transform: scale(1.15) translateY(3px); opacity: 1; }
      76%     { transform: scale(1.35) translateY(14px); opacity: 0; }
      100%    { transform: scale(1.35) translateY(14px); opacity: 0; }
    }
    .fw-1-sparks {
      transform-origin: 90px 130px;
      animation: s1 3.6s steps(3, start) infinite;
    }
    @keyframes s1 {
      0%, 40% { transform: scale(0.3); opacity: 0; }
      58%     { transform: scale(1.1) translateY(5px); opacity: 1; }
      76%     { transform: scale(1.4) translateY(20px); opacity: 0; }
      100%    { transform: scale(1.4) translateY(20px); opacity: 0; }
    }

    /* 右上方烟花 (周期 3.6s, 延迟 1.8s) */
    .fw-2-rocket {
      animation: r2 3.6s steps(4, start) 1.8s infinite;
    }
    @keyframes r2 {
      0%   { transform: translateY(190px); opacity: 0; }
      12%  { transform: translateY(150px); opacity: 1; }
      32%  { transform: translateY(0px); opacity: 1; }
      40%  { transform: translateY(-25px); opacity: 0; }
      100% { transform: translateY(-25px); opacity: 0; }
    }
    .fw-2-burst {
      transform-origin: 230px 150px;
      animation: b2 3.6s steps(3, start) 1.8s infinite;
    }
    @keyframes b2 {
      0%, 32% { transform: scale(0.1); opacity: 0; }
      40%     { transform: scale(0.6); opacity: 1; }
      58%     { transform: scale(1.15) translateY(3px); opacity: 1; }
      76%     { transform: scale(1.35) translateY(14px); opacity: 0; }
      100%    { transform: scale(1.35) translateY(14px); opacity: 0; }
    }
    .fw-2-sparks {
      transform-origin: 230px 150px;
      animation: s2 3.6s steps(3, start) 1.8s infinite;
    }
    @keyframes s2 {
      0%, 40% { transform: scale(0.3); opacity: 0; }
      58%     { transform: scale(1.1) translateY(5px); opacity: 1; }
      76%     { transform: scale(1.4) translateY(20px); opacity: 0; }
      100%    { transform: scale(1.4) translateY(20px); opacity: 0; }
    }

    /* 极简碎纸 3 组交替下落 (每组 3~4 个) */
    .confetti-group-a {
      animation: conf-a 4.5s steps(4, start) infinite;
    }
    @keyframes conf-a {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      15%  { transform: translateY(30px) rotate(15deg); opacity: 1; }
      60%  { transform: translateY(170px) rotate(-10deg); opacity: 1; }
      90%  { transform: translateY(280px) rotate(20deg); opacity: 0; }
      100% { transform: translateY(280px); opacity: 0; }
    }

    .confetti-group-b {
      animation: conf-b 4.5s steps(4, start) 1.5s infinite;
    }
    @keyframes conf-b {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      15%  { transform: translateY(35px) rotate(-15deg); opacity: 1; }
      60%  { transform: translateY(180px) rotate(15deg); opacity: 1; }
      90%  { transform: translateY(290px) rotate(-20deg); opacity: 0; }
      100% { transform: translateY(290px); opacity: 0; }
    }

    .confetti-group-c {
      animation: conf-c 4.5s steps(4, start) 3.0s infinite;
    }
    @keyframes conf-c {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      15%  { transform: translateY(30px) rotate(20deg); opacity: 1; }
      60%  { transform: translateY(175px) rotate(-15deg); opacity: 1; }
      90%  { transform: translateY(285px) rotate(10deg); opacity: 0; }
      100% { transform: translateY(285px); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container" onclick="toggleMode()">
    
    <div class="mode-tip" id="mode-text">方案 A：摇曳热气咖啡</div>

    <!-- 方案 1: 咖啡热气 -->
    <div class="view-panel active" id="panel-coffee">
      <div class="coffee-icon">
        <svg viewBox="0 0 100 100" style="width:100%;height:100%;">
          <!-- 3 缕动态摇曳热气 -->
          <path id="steam-1" class="steam-line" d="M36 22 Q 32 14 36 6" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
          <path id="steam-2" class="steam-line" d="M48 22 Q 44 14 48 6" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
          <path id="steam-3" class="steam-line" d="M60 22 Q 56 14 60 6" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
          <!-- 咖啡杯身 -->
          <path d="M22 30 L74 30 L68 76 C68 82 62 86 54 86 L42 86 C34 86 28 82 28 76 Z" fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
          <!-- 杯把手 -->
          <path d="M72 38 C84 38 88 46 88 56 C88 66 82 70 70 70" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
          <!-- 杯底托盘 -->
          <path d="M16 92 L80 92" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- 方案 2: 双烟花 + 碎纸 -->
    <div class="view-panel" id="panel-firework">
      <svg viewBox="0 0 320 460" class="firework-svg">
        
        <!-- 1. 左上方烟花 (爆心: 90, 130) -->
        <g>
          <g class="fw-1-rocket">
            <circle cx="90" cy="150" r="3" fill="#000"/>
            <line x1="90" y1="155" x2="90" y2="195" stroke="#000" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
          </g>
          <g class="fw-1-burst" fill="none" stroke="#000" stroke-linecap="round">
            <line x1="90" y1="98" x2="90" y2="72" stroke-width="2.2"/>
            <line x1="90" y1="162" x2="90" y2="188" stroke-width="2.2"/>
            <line x1="58" y1="130" x2="32" y2="130" stroke-width="2.2"/>
            <line x1="122" y1="130" x2="148" y2="130" stroke-width="2.2"/>
            <line x1="68" y1="108" x2="50" y2="90" stroke-width="1.8"/>
            <line x1="112" y1="152" x2="130" y2="170" stroke-width="1.8"/>
            <line x1="68" y1="152" x2="50" y2="170" stroke-width="1.8"/>
            <line x1="112" y1="108" x2="130" y2="90" stroke-width="1.8"/>
            <circle cx="90" cy="130" r="2.4" fill="#000" stroke="none"/>
          </g>
          <g class="fw-1-sparks" fill="#000">
            <circle cx="90" cy="60" r="2"/>
            <circle cx="90" cy="200" r="2"/>
            <circle cx="20" cy="130" r="2"/>
            <circle cx="160" cy="130" r="2"/>
            <circle cx="40" cy="80" r="1.4"/>
            <circle cx="140" cy="180" r="1.4"/>
            <circle cx="40" cy="180" r="1.4"/>
            <circle cx="140" cy="80" r="1.4"/>
          </g>
        </g>

        <!-- 2. 右上方烟花 (爆心: 230, 150) -->
        <g>
          <g class="fw-2-rocket">
            <circle cx="230" cy="170" r="3" fill="#000"/>
            <line x1="230" y1="175" x2="230" y2="215" stroke="#000" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
          </g>
          <g class="fw-2-burst" fill="none" stroke="#000" stroke-linecap="round">
            <line x1="230" y1="118" x2="230" y2="92" stroke-width="2.2"/>
            <line x1="230" y1="182" x2="230" y2="208" stroke-width="2.2"/>
            <line x1="198" y1="150" x2="172" y2="150" stroke-width="2.2"/>
            <line x1="262" y1="150" x2="288" y2="150" stroke-width="2.2"/>
            <line x1="208" y1="128" x2="190" y2="110" stroke-width="1.8"/>
            <line x1="252" y1="172" x2="270" y2="190" stroke-width="1.8"/>
            <line x1="208" y1="172" x2="190" y2="190" stroke-width="1.8"/>
            <line x1="252" y1="128" x2="270" y2="110" stroke-width="1.8"/>
            <circle cx="230" cy="150" r="2.4" fill="#000" stroke="none"/>
          </g>
          <g class="fw-2-sparks" fill="#000">
            <circle cx="230" cy="80" r="2"/>
            <circle cx="230" cy="220" r="2"/>
            <circle cx="160" cy="150" r="2"/>
            <circle cx="300" cy="150" r="2"/>
            <circle cx="180" cy="100" r="1.4"/>
            <circle cx="280" cy="200" r="1.4"/>
            <circle cx="180" cy="200" r="1.4"/>
            <circle cx="280" cy="100" r="1.4"/>
          </g>
        </g>

        <!-- 3. 极简碎纸组 (每组 3~4 个元素) -->
        <g class="confetti-group-a">
          <rect x="60" y="50" width="8" height="3.5" rx="1" fill="#000" transform="rotate(25 60 50)"/>
          <rect x="180" y="35" width="7" height="3.5" rx="1" fill="none" stroke="#000" stroke-width="1.2" transform="rotate(-30 180 35)"/>
          <circle cx="270" cy="70" r="1.8" fill="#000"/>
        </g>

        <g class="confetti-group-b">
          <rect x="120" y="45" width="8" height="3.5" rx="1" fill="none" stroke="#000" stroke-width="1.2" transform="rotate(35 120 45)"/>
          <rect x="220" y="60" width="7.5" height="3.5" rx="1" fill="#000" transform="rotate(-20 220 60)"/>
          <circle cx="75" cy="80" r="1.8" fill="#000"/>
          <polygon points="160,30 163,35 157,35" fill="#000"/>
        </g>

        <g class="confetti-group-c">
          <rect x="145" y="70" width="8" height="3.5" rx="1" fill="#000" transform="rotate(-40 145 70)"/>
          <rect x="250" y="40" width="7" height="3.5" rx="1" fill="none" stroke="#000" stroke-width="1.2" transform="rotate(15 250 40)"/>
          <circle cx="195" cy="85" r="1.8" fill="#000"/>
        </g>

      </svg>
    </div>

    <div class="footer-tip">点击屏幕任意区域切换方案</div>

  </div>

  <script>
    var currentMode = 0; // 0: 咖啡, 1: 烟花
    var modeTextEl = document.getElementById('mode-text');
    var panelCoffeeEl = document.getElementById('panel-coffee');
    var panelFireworkEl = document.getElementById('panel-firework');

    // 咖啡热气形态数组
    var STEAM_PATHS = [
      {
        s1: 'M36 22 Q 32 14 36 6',
        s2: 'M48 22 Q 44 14 48 6',
        s3: 'M60 22 Q 56 14 60 6'
      },
      {
        s1: 'M36 22 Q 40 14 36 6',
        s2: 'M48 22 Q 52 14 48 6',
        s3: 'M60 22 Q 64 14 60 6'
      },
      {
        s1: 'M36 22 Q 34 14 38 5',
        s2: 'M48 22 Q 46 14 50 5',
        s3: 'M60 22 Q 58 14 62 5'
      }
    ];
    var steamStep = 0;
    var steam1El = document.getElementById('steam-1');
    var steam2El = document.getElementById('steam-2');
    var steam3El = document.getElementById('steam-3');

    setInterval(function() {
      if (currentMode === 0) {
        steamStep = (steamStep + 1) % STEAM_PATHS.length;
        var cur = STEAM_PATHS[steamStep];
        steam1El.setAttribute('d', cur.s1);
        steam2El.setAttribute('d', cur.s2);
        steam3El.setAttribute('d', cur.s3);
      }
    }, 2000);

    function toggleMode() {
      currentMode = (currentMode === 0) ? 1 : 0;
      if (currentMode === 0) {
        modeTextEl.innerText = '方案 A：摇曳热气咖啡';
        panelCoffeeEl.className = 'view-panel active';
        panelFireworkEl.className = 'view-panel';
      } else {
        modeTextEl.innerText = '方案 B：双烟花 + 极简碎纸';
        panelCoffeeEl.className = 'view-panel';
        panelFireworkEl.className = 'view-panel active';
      }
    }
  </script>
</body>
</html>
