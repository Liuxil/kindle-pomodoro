<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="番茄钟">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Pomodoro</title>
  
  <!-- 引入类似 7段式液晶的电子字体 -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  </style>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      overflow: hidden !important;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

    #screen-bounds {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden !important;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }

    #app-container {
      position: absolute;
      top: 50%; left: 50%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      transition: transform 0.3s ease-out, width 0.3s, height 0.3s;
    }

    /* 状态 A: 物理方向与逻辑显示一致 (正常渲染，0度) */
    #app-container.orient-match {
      width: 100vw; height: 100vh;
      max-width: 100vw; max-height: 100vh;
      transform: translate(-50%, -50%);
    }

    /* 状态 B: 手机物理是竖向，但用户强制切到横版 (需要转90度) */
    #app-container.orient-force-landscape {
      width: 100vh; height: 100vw;
      max-width: 100vh; max-height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }

    /* 状态 C: 手机物理是横向，但用户强制切到竖版 (需要转-90度) */
    #app-container.orient-force-portrait {
      width: 100vh; height: 100vw;
      max-width: 100vh; max-height: 100vw;
      transform: translate(-50%, -50%) rotate(-90deg);
    }

    .sky-badge { width: 60px; height: 60px; position: relative; cursor: pointer; flex-shrink: 0; }
    .sun-box, .moon-box { width: 100%; height: 100%; position: relative; display: none; }
    .sun-rays { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.5s linear; }
    .sun-face {
      position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px;
      background: #ffffff; border: 2.5px solid #000000; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .moon-star { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; transition: transform 0.3s ease; }

    .main-section {
      width: 100%; flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-container {
      width: 100%; cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .timer-text {
      font-size: 250px;
      line-height: 1;
      margin: -15px 0; 
      text-align: center;
      width: 100%;
      display: block;
      letter-spacing: -6px;
      white-space: nowrap;
    }

    /* 竖屏文字样式 (减小字号，调整行距适应两行) */
    .portrait-format .timer-text {
      font-size: 190px;
      line-height: 0.85; 
      margin: 0;
      letter-spacing: -2px;
      white-space: normal;
    }

    /* 字体样式 0 与 1 保持不变 */
    .font-style-0 { font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif; font-weight: 200; color: transparent !important; -webkit-text-fill-color: transparent !important; -webkit-text-stroke: 1.5px #000000; }
    .font-style-1 { font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif; font-weight: 200; color: #000000 !important; -webkit-text-fill-color: #000000 !important; -webkit-text-stroke: 0 !important; }
    
    /* 字体样式 2: 替换为 7段式液晶数字风格 */
    .font-style-2 { 
      font-family: 'Share Tech Mono', monospace; 
      font-weight: 400; 
      letter-spacing: -8px; 
      color: #000000 !important; 
      -webkit-text-fill-color: #000000 !important; 
      -webkit-text-stroke: 0 !important; 
    }
    .portrait-format .font-style-2 {
      letter-spacing: -4px;
    }

    .tracks-container {
      width: 96%; height: 26px; margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-slot { width: 20px; height: 20px; display: flex; justify-content: center; align-items: center; }
    .track-slot svg { width: 18px; height: 18px; fill: #000000; display: none; }
    .track-slot:nth-child(even) svg { margin-top: 4px; transform: rotate(6deg); }
    .track-slot:nth-child(odd) svg { margin-top: -4px; transform: rotate(-6deg); }
    .track-slot.active svg { display: block; }

    .footer {
      width: 94%; flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-adjust-group { display: flex; gap: 10px; }
    button {
      background: #ffffff; color: #000000; border: 3px solid #000000; font-weight: bold; border-radius: 8px; cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #000000; color: #ffffff; }
    .btn-adjust { font-size: 18px; padding: 5px 14px; }
    
    .btn-start {
      background: transparent !important; border: none !important; padding: 5px; width: 72px; height: 72px;
      display: flex; justify-content: center; align-items: center;
    }
    .btn-start:active { background: transparent !important; color: #000000 !important; opacity: 0.4; }
    .btn-start svg { width: 42px; height: 42px; }

    .rest-screen, .standby-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 100; cursor: pointer;
      justify-content: center; align-items: center;
    }
    .rest-screen.active, .standby-screen.active { display: flex; }
    .standby-screen { z-index: 90; flex-direction: column; }
    .rest-panel { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; }
    .rest-panel.active { display: flex; }
    
    .pixel-stage, .pixel-cat-stage { width: 280px; height: 280px; position: relative; }
    .anim-layer, .anim-frame, .cat-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .anim-frame.active, .cat-frame.active { display: block; }
  </style>
</head>

      restScreen: document.getElementById('rest-screen'),
      sunBox: document.getElementById('sun-box'),
      moonBox: document.getElementById('moon-box'),
      sunRays: document.getElementById('sun-rays'),
      moonStar: document.getElementById('moon-star'),
      tracksBottom: document.getElementById('tracks-bottom'),
      standbyScreen: document.getElementById('standby-screen')
    };

    var trackSlots = [];
    var lastDisplayedText = '';
    var lastLeadIndex = -1;

    function init() {
      initOrientation();
      initDOM();
      initSavedSettings();
      updateDayNightMode();
      clearTracks();
      updateDisplay();
      bindEvents();
      resetIdleTimer(); // 初始化待机倒计时
    }

    /* ====================================================
       1. 陀螺仪与自适应横竖屏逻辑
       ==================================================== */
    function initOrientation() {
      var mql = window.matchMedia("(orientation: portrait)");
      isPhysicalPortrait = mql.matches;
      isLogicalPortrait = isPhysicalPortrait; 
      
      mql.addEventListener("change", function(e) {
        isPhysicalPortrait = e.matches;
        isLogicalPortrait = isPhysicalPortrait;
        applyOrientationLogic();
      });
    }

    function applyOrientationLogic() {
      els.appContainer.className = "";
      
      if (isLogicalPortrait === isPhysicalPortrait) {
        els.appContainer.classList.add("orient-match");
      } else if (isPhysicalPortrait && !isLogicalPortrait) {
        els.appContainer.classList.add("orient-force-landscape");
      } else {
        els.appContainer.classList.add("orient-force-portrait");
      }

      if (isLogicalPortrait) {
        els.appContainer.classList.add("portrait-format");
      } else {
        els.appContainer.classList.remove("portrait-format");
      }

      updateDisplay(); 
    }

    function toggleOrientation() {
      isLogicalPortrait = !isLogicalPortrait;
      applyOrientationLogic();
    }

    /* ====================================================
       2. 初始化、事件绑定与彩蛋触发
       ==================================================== */
    function initDOM() {
      var slotsHtml = '';
      for (var i = 0; i < TOTAL_SLOTS; i++) { slotsHtml += '<div class="track-slot"></div>'; }
      els.tracksBottom.innerHTML = slotsHtml;
      trackSlots = els.tracksBottom.querySelectorAll('.track-slot');
      els.btnToggle.innerHTML = ICON_PLAY;

      // 提取最新的动画帧节点
      els.restPanels = [document.getElementById('rest-panel-0'), document.getElementById('rest-panel-1'), document.getElementById('rest-panel-2')];
      els.birdFrames = document.getElementById('stage-bird-coffee').querySelectorAll('.anim-frame');
      els.flowerFrames = document.getElementById('flower-layer').querySelectorAll('.anim-frame');
      els.butterflyFrames = document.getElementById('butterfly-layer').querySelectorAll('.anim-frame');
      els.cats = [document.getElementById('cat-p0'), document.getElementById('cat-p1')];
      els.standbyCats = [document.getElementById('standby-cat-p0'), document.getElementById('standby-cat-p1')];
    }

    function bindEvents() {
      document.getElementById('btn-orientation').addEventListener('click', toggleOrientation);
      document.getElementById('btn-font-switch').addEventListener('click', switchFont);
      
      els.btnToggle.addEventListener('click', function(e) {
        if (e) e.preventDefault();
        toggleTimer();
        this.blur();
      });
      
      var adjustBtns = document.querySelectorAll('.btn-adjust');
      for (var m = 0; m < adjustBtns.length; m++) {
        adjustBtns[m].addEventListener('click', function(e) {
          addMinutes(parseInt(e.target.getAttribute('data-adj'), 10));
          e.target.blur();
        });
      }

      els.restScreen.addEventListener('click', hideRestScreen);
      els.standbyScreen.addEventListener('click', hideStandbyScreen);
      document.addEventListener('click', resetIdleTimer, true);
    }

    function handleEasterEgg(action) {
      if (action === 'FONT') {
        if (easterEggStep === 0 || easterEggStep === 1) { easterEggStep++; } else { easterEggStep = 2; }
      } else if (action === '+10') {
        if (easterEggStep === 2) { easterEggStep = 3; } else if (easterEggStep === 3) { easterEggStep = 4; } else { easterEggStep = 0; }
      } else if (action === '+5') {
        if (easterEggStep === 4) { easterEggStep = 5; } else if (easterEggStep === 6) { easterEggStep = 7; } else { easterEggStep = 0; }
      } else if (action === '-5') {
        if (easterEggStep === 5) { easterEggStep = 6; } else if (easterEggStep === 7) { easterEggStep = 0; return true; } else { easterEggStep = 0; }
      } else {
        easterEggStep = 0;
      }
      return false;
    }

    function initSavedSettings() {
      applyOrientationLogic(); 
      try {
        var savedFont = localStorage.getItem('kindle_pomodoro_font');
        if (savedFont !== null) { currentFontIndex = parseInt(savedFont, 10) % TOTAL_FONTS || 0; }
      } catch (e) {}
      applyFont();
    }

    function switchFont() {
      currentFontIndex = (currentFontIndex + 1) % TOTAL_FONTS;
      try { localStorage.setItem('kindle_pomodoro_font', currentFontIndex); } catch(e) {}
      applyFont();
      handleEasterEgg('FONT');
    }

    function applyFont() {
      els.timerText.className = 'timer-text font-style-' + currentFontIndex;
    }

    /* ====================================================
       3. 定时器核心逻辑与天象动画
       ==================================================== */
    function toggleTimer() {
      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      } else { 
        if (timeLeft <= 0 || !hasStarted) {
          timeLeft = totalTime;
          startAnimalTracks();
        }
        updateDayNightMode();
        targetEndTime = new Date().getTime() + (timeLeft * 1000);
        timerId = setInterval(tick, 1000);
        els.btnToggle.innerHTML = ICON_PAUSE;
      }
    }

    function tick() {
      var now = new Date().getTime();
      var newTimeLeft = Math.max(0, Math.ceil((targetEndTime - now) / 1000));
      
      if (newTimeLeft !== timeLeft) { 
        var elapsedSeconds = totalTime - newTimeLeft;
        timeLeft = newTimeLeft;
        
        if (elapsedSeconds % SKY_INTERVAL === 0) tickSkyBadge();
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          els.btnToggle.innerHTML = ICON_PLAY;
          timeLeft = totalTime;
          clearTracks();
          updateDisplay();
          showRestScreen(); // 倒计时结束自动弹出休息面板
        }
      }
    }

    function tickSkyBadge() {
      if (isDayTime) {
        sunAngle = (sunAngle + 15) % 360;
        els.sunRays.style.transform = 'rotate(' + sunAngle + 'deg)';
        els.sunRays.style.webkitTransform = 'rotate(' + sunAngle + 'deg)';
      } else {
        starToggled = !starToggled;
        var starAngle = starToggled ? 20 : 0;
        els.moonStar.style.transform = 'rotate(' + starAngle + 'deg)';
        els.moonStar.style.webkitTransform = 'rotate(' + starAngle + 'deg)';
      }
    }

    function addMinutes(mins) {
      var actionStr = (mins > 0 ? '+' : '') + mins;
      var isEggTriggered = handleEasterEgg(actionStr);

      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      }
      var currentMins = Math.round(totalTime / 60) + mins;
      if (currentMins > 120) { currentMins = 5; } else if (currentMins < 5) { currentMins = 120; }
      totalTime = currentMins * 60;
      timeLeft = totalTime;
      clearTracks();
      updateDayNightMode();
      updateDisplay();
      
      if (isEggTriggered) showRestScreen();
    }

    /* ====================================================
       4. 时钟渲染逻辑
       ==================================================== */
    function updateDisplay() {
      var totalMinutes = Math.ceil(timeLeft / 60);
      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;
      
      var strH = (hours < 10 ? '0' : '') + hours;
      var strM = (mins < 10 ? '0' : '') + mins;
      
      var newText = isLogicalPortrait ? (strH + '<br>' + strM) : (strH + ':' + strM);

      if (newText !== lastDisplayedText) {
        els.timerText.innerHTML = newText;
        lastDisplayedText = newText;
      }
      
      if (!hasStarted || !currentAnimal) return;
      var progressRatio = (totalTime - timeLeft) / totalTime;
      var leadIndex = Math.min(TOTAL_SLOTS - 1, Math.floor(progressRatio * TOTAL_SLOTS));

      if (leadIndex === lastLeadIndex) return;
      lastLeadIndex = leadIndex;

      var count = currentAnimal.feetCount;
      for (var i = 0; i < trackSlots.length; i++) { trackSlots[i].className = 'track-slot'; }
      for (var k = 0; k < count; k++) {
        var pos = leadIndex - k;
        if (pos >= 0 && pos < TOTAL_SLOTS) { trackSlots[pos].className = 'track-slot active'; }
      }
    }

    function updateDayNightMode() {
      var hour = new Date().getHours();
      isDayTime = (hour >= 6 && hour < 18);
      els.sunBox.style.display = isDayTime ? 'block' : 'none';
      els.moonBox.style.display = isDayTime ? 'none' : 'block';
    }

    function startAnimalTracks() {
      var randIndex = Math.floor(Math.random() * ANIMALS.length);
      currentAnimal = ANIMALS[randIndex];
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = currentAnimal.svg;
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = true;
      lastLeadIndex = -1;
      updateDisplay();
    }

    function clearTracks() {
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = '';
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = false;
      lastLeadIndex = -1;
    }

    /* ====================================================
       5. 休息界面、待机与 SVG 动画控制
       ==================================================== */
    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        if (!hasStarted && els.restScreen.className.indexOf('active') === -1 && els.standbyScreen.className.indexOf('active') === -1) {
          showStandbyScreen();
        }
      }, IDLE_TIMEOUT_MS);
    }

    function showStandbyScreen() {
      standbyCatStep = 0;
      els.standbyCats[0].className = 'cat-frame active';
      els.standbyCats[1].className = 'cat-frame';
      els.standbyScreen.className = 'standby-screen active';

      if (standbyAnimTimer) clearInterval(standbyAnimTimer);
      standbyAnimTimer = setInterval(function() {
        standbyCatStep = 1 - standbyCatStep;
        els.standbyCats[0].className = standbyCatStep === 0 ? 'cat-frame active' : 'cat-frame';
        els.standbyCats[1].className = standbyCatStep === 1 ? 'cat-frame active' : 'cat-frame';
      }, 1800); 
    }

    function hideStandbyScreen(e) {
      if (e) e.stopPropagation();
      els.standbyScreen.className = 'standby-screen';
      if (standbyAnimTimer) { clearInterval(standbyAnimTimer); standbyAnimTimer = null; }
      resetIdleTimer();
    }

    function showRestScreen() {
      restAnimState.index = Math.floor(Math.random() * els.restPanels.length);
      updateActiveRestPanel();
      els.restScreen.className = 'rest-screen active';

      if (restAnimState.timer) clearInterval(restAnimState.timer);
      restAnimState.timer = setInterval(animateRestPanel, REST_ANIM_INTERVALS[restAnimState.index]);
    }

    function hideRestScreen(e) {
      if (e) e.stopPropagation();
      els.restScreen.className = 'rest-screen';
      if (restAnimState.timer) clearInterval(restAnimState.timer);
    }

    function updateActiveRestPanel() {
      for (var i = 0; i < els.restPanels.length; i++) {
        els.restPanels[i].className = (i === restAnimState.index) ? 'rest-panel active' : 'rest-panel';
      }
    }

    function animateRestPanel() {
      if (els.restScreen.className.indexOf('active') === -1) return;

      var idx = restAnimState.index;
      if (idx === 0) {
        els.birdFrames[restAnimState.birdStep].className = 'anim-frame';
        restAnimState.birdStep = (restAnimState.birdStep + 1) % 4;
        els.birdFrames[restAnimState.birdStep].className = 'anim-frame active';
      } else if (idx === 1) {
        els.butterflyFrames[restAnimState.comboStep % 16].className = 'anim-frame';
        els.flowerFrames[Math.floor(restAnimState.comboStep / 4) % 8].className = 'anim-frame';
        
        restAnimState.comboStep++;
        if (restAnimState.comboStep >= 3200) restAnimState.comboStep = 0;
        
        els.butterflyFrames[restAnimState.comboStep % 16].className = 'anim-frame active';
        els.flowerFrames[Math.floor(restAnimState.comboStep / 4) % 8].className = 'anim-frame active';
      } else if (idx === 2) {
        restAnimState.catStep = 1 - restAnimState.catStep;
        els.cats[0].className = restAnimState.catStep === 0 ? 'cat-frame active' : 'cat-frame';
        els.cats[1].className = restAnimState.catStep === 1 ? 'cat-frame active' : 'cat-frame';
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
