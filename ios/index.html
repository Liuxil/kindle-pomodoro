<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="番茄钟">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Pomodoro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      overflow: hidden !important;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

    #screen-bounds {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden !important;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }

    /* 
      1. 基础容器，加入过渡动画让旋转更平滑 
    */
    #app-container {
      position: absolute;
      top: 50%; left: 50%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      transition: transform 0.3s ease-out, width 0.3s, height 0.3s;
    }

    /* 状态 A: 物理方向与逻辑显示一致 (正常渲染，0度) */
    #app-container.orient-match {
      width: 100vw; height: 100vh;
      max-width: 100vw; max-height: 100vh;
      transform: translate(-50%, -50%);
    }

    /* 状态 B: 手机物理是竖向，但用户强制切到横版 (需要转90度) */
    #app-container.orient-force-landscape {
      width: 100vh; height: 100vw;
      max-width: 100vh; max-height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }

    /* 状态 C: 手机物理是横向，但用户强制切到竖版 (需要转-90度) */
    #app-container.orient-force-portrait {
      width: 100vh; height: 100vw;
      max-width: 100vh; max-height: 100vw;
      transform: translate(-50%, -50%) rotate(-90deg);
    }

    .sky-badge { width: 60px; height: 60px; position: relative; cursor: pointer; flex-shrink: 0; }
    .sun-box, .moon-box { width: 100%; height: 100%; position: relative; display: none; }
    .sun-rays { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .sun-face {
      position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px;
      background: #ffffff; border: 2.5px solid #000000; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .moon-star { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; }

    .main-section {
      width: 100%; flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-container {
      width: 100%; cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* 
      2. 默认横屏文字样式 
    */
    .timer-text {
      font-size: 250px;
      line-height: 1;
      margin: -15px 0; 
      text-align: center;
      width: 100%;
      display: block;
      letter-spacing: -6px;
      white-space: nowrap;
    }

    /* 
      3. 竖屏文字样式 (减小字号，调整行距适应两行) 
    */
    .portrait-format .timer-text {
      font-size: 190px;
      line-height: 0.85; 
      margin: 0;
      letter-spacing: -2px;
      white-space: normal;
    }

    .font-style-0 { font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif; font-weight: 200; color: transparent !important; -webkit-text-fill-color: transparent !important; -webkit-text-stroke: 1.5px #000000; }
    .font-style-1 { font-family: "Helvetica Neue Light", "Helvetica Neue", "Arial Narrow", sans-serif; font-weight: 200; color: #000000 !important; -webkit-text-fill-color: #000000 !important; -webkit-text-stroke: 0 !important; }
    .font-style-2 { font-family: "Baskerville", "Bookerly Light", "Georgia", serif; font-weight: 200; letter-spacing: -1px; color: #000000; -webkit-text-fill-color: #000000; -webkit-text-stroke: 0; }

    .tracks-container {
      width: 96%; height: 26px; margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-slot { width: 20px; height: 20px; display: flex; justify-content: center; align-items: center; }
    .track-slot svg { width: 18px; height: 18px; fill: #000000; display: none; }
    .track-slot:nth-child(even) svg { margin-top: 4px; transform: rotate(6deg); }
    .track-slot:nth-child(odd) svg { margin-top: -4px; transform: rotate(-6deg); }
    .track-slot.active svg { display: block; }

    .footer {
      width: 94%; flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-adjust-group { display: flex; gap: 10px; }
    button {
      background: #ffffff; color: #000000; border: 3px solid #000000; font-weight: bold; border-radius: 8px; cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #000000; color: #ffffff; }
    .btn-adjust { font-size: 18px; padding: 5px 14px; }
    
    .btn-start {
      background: transparent !important; border: none !important; padding: 5px; width: 72px; height: 72px;
      display: flex; justify-content: center; align-items: center;
    }
    .btn-start:active { background: transparent !important; color: #000000 !important; opacity: 0.4; }
    .btn-start svg { width: 42px; height: 42px; }

    .rest-screen, .standby-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 100; cursor: pointer;
      justify-content: center; align-items: center;
    }
    .rest-screen.active, .standby-screen.active { display: flex; }
    .standby-screen { z-index: 90; flex-direction: column; }
    .rest-panel { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; }
    .rest-panel.active { display: flex; }
    
    .pixel-stage, .pixel-cat-stage { width: 280px; height: 280px; position: relative; }
    .anim-layer, .anim-frame, .cat-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .anim-frame.active, .cat-frame.active { display: block; }
  </style>
</head>
<body>
  
  <div id="screen-bounds">
    <div id="app-container">
      <div class="sky-badge" id="btn-orientation" title="点击切换横/竖屏">
        <div class="sun-box" id="sun-box">
          <div class="sun-rays" id="sun-rays">
            <svg viewBox="0 0 100 100" stroke="#000" stroke-linecap="round">
              <path d="M50 4 L50 16" stroke-width="4.5"/><path d="M50 84 L50 96" stroke-width="4.5"/><path d="M4 50 L16 50" stroke-width="4.5"/><path d="M84 50 L96 50" stroke-width="4.5"/>
              <path d="M17 17 L26 26" stroke-width="4"/><path d="M74 74 L83 83" stroke-width="4"/><path d="M17 83 L26 74" stroke-width="4"/><path d="M74 26 L83 17" stroke-width="4"/>
            </svg>
          </div>
          <div class="sun-face"></div>
        </div>
        <div class="moon-box" id="moon-box">
          <svg viewBox="0 0 68 68" style="width:100%;height:100%;"><path d="M38 12 C24 12 12 24 12 38 C12 48 18 56 26 59 C23 54 22 48 22 42 C22 28 32 17 46 16 C43 13 40 12 38 12 Z" fill="#000"/></svg>
          <div class="moon-star" id="moon-star">
            <svg viewBox="0 0 24 24"><path d="M12 2 Q 12 12 2 12 Q 12 12 12 22 Q 12 12 22 12 Q 12 12 12 2 Z" fill="#000"/></svg>
          </div>
        </div>
      </div>

      <div class="main-section">
        <div class="timer-container" id="btn-font-switch">
          <div class="timer-text font-style-1" id="timer-text">00:25</div>
        </div>
        <div class="tracks-container" id="tracks-bottom"></div>
      </div>

      <div class="footer">
        <div class="btn-adjust-group">
          <button class="btn-adjust" data-adj="5">+5</button>
          <button class="btn-adjust" data-adj="10">+10</button>
          <button class="btn-adjust" data-adj="-5">-5</button>
        </div>
        <div>
          <button id="btn-toggle" class="btn-start"></button>
        </div>
      </div>

      <!-- 省略了中间的休息界面 SVG 动画以保持简练，请原样保留你原本拥有的 rest-panel 动画节点 -->
      <div class="rest-screen" id="rest-screen">
        <div class="rest-panel active" id="rest-panel-0">
          <div class="pixel-stage">
            <div class="anim-frame active"><svg viewBox="0 0 200 200" fill="#000"><rect x="80" y="80" width="40" height="40"/></svg></div>
          </div>
        </div>
      </div>

      <div class="standby-screen" id="standby-screen">
        <div class="pixel-cat-stage">
          <div class="cat-frame active"><svg viewBox="0 0 200 200" fill="#000"><rect x="80" y="80" width="40" height="40"/></svg></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    var ICON_PLAY = '<svg viewBox="0 0 16 16" style="shape-rendering: crispEdges;"><rect x="4" y="2" width="2" height="12" fill="#000"/><rect x="6" y="3" width="2" height="10" fill="#000"/><rect x="8" y="4" width="2" height="8" fill="#000"/><rect x="10" y="5" width="2" height="6" fill="#000"/><rect x="12" y="6" width="2" height="4" fill="#000"/><rect x="14" y="7" width="2" height="2" fill="#000"/></svg>';
    var ICON_PAUSE = '<svg viewBox="0 0 16 16" style="shape-rendering: crispEdges;"><rect x="3" y="2" width="4" height="12" fill="#000"/><rect x="9" y="2" width="4" height="12" fill="#000"/></svg>';

    var ANIMALS = [
      { feetCount: 4, svg: '<svg viewBox="0 0 24 24"><ellipse cx="9" cy="12" rx="4.5" ry="5.5"/><circle cx="16" cy="7" r="2"/><circle cx="19" cy="12" r="2.2"/><circle cx="16" cy="17" r="2"/></svg>' },
      { feetCount: 2, svg: '<svg viewBox="0 0 24 24"><path d="M5 12 L19 12 M13 12 L19 6 M13 12 L19 18" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
    ];
    
    var TOTAL_SLOTS = 16;
    var TOTAL_FONTS = 3;

    var totalTime = 25 * 60;
    var timeLeft = totalTime;
    var targetEndTime = null;
    var timerId = null;
    var hasStarted = false;
    
    var isDayTime = true;
    var sunAngle = 0;
    var starToggled = false;
    var currentAnimal = null;
    var currentFontIndex = 1; 

    // 新增两个状态变量追踪横竖屏逻辑
    var isPhysicalPortrait = true;  // 手机真实的物理状态（竖着拿还是横着拿）
    var isLogicalPortrait = true;   // 页面希望渲染的视觉状态

    var els = {
      appContainer: document.getElementById('app-container'),
      timerText: document.getElementById('timer-text'),
      btnToggle: document.getElementById('btn-toggle'),
      restScreen: document.getElementById('rest-screen'),
      sunBox: document.getElementById('sun-box'),
      moonBox: document.getElementById('moon-box'),
      sunRays: document.getElementById('sun-rays'),
      moonStar: document.getElementById('moon-star'),
      tracksBottom: document.getElementById('tracks-bottom'),
      standbyScreen: document.getElementById('standby-screen')
    };

    var trackSlots = [];
    var lastDisplayedText = '';
    var lastLeadIndex = -1;

    function init() {
      initOrientation(); // 优先初始化陀螺仪监听
      initDOM();
      initSavedSettings();
      updateDayNightMode();
      clearTracks();
      updateDisplay();
      bindEvents();
    }

    /* ====================================================
       1. 陀螺仪与自适应横竖屏逻辑 
       ==================================================== */
    function initOrientation() {
      var mql = window.matchMedia("(orientation: portrait)");
      isPhysicalPortrait = mql.matches;
      // 页面初次加载时，逻辑排版直接跟随手机的物理姿态
      isLogicalPortrait = isPhysicalPortrait; 
      
      // 监听手机陀螺仪/横竖屏变化
      mql.addEventListener("change", function(e) {
        isPhysicalPortrait = e.matches;
        // 当手机物理翻转时，解除用户的强制设定，自动归位自适应
        isLogicalPortrait = isPhysicalPortrait;
        applyOrientationLogic();
      });
    }

    function applyOrientationLogic() {
      // 重置类名
      els.appContainer.className = "";
      
      // 依据当前物理姿态和逻辑需求，分发 CSS 布局状态
      if (isLogicalPortrait === isPhysicalPortrait) {
        els.appContainer.classList.add("orient-match");           // 无需强制旋转
      } else if (isPhysicalPortrait && !isLogicalPortrait) {
        els.appContainer.classList.add("orient-force-landscape"); // 物理竖向，强制横版视图
      } else {
        els.appContainer.classList.add("orient-force-portrait");  // 物理横向，强制竖版视图
      }

      // 控制内部元素的排版结构 (竖版还是横版)
      if (isLogicalPortrait) {
        els.appContainer.classList.add("portrait-format");
      } else {
        els.appContainer.classList.remove("portrait-format");
      }

      updateDisplay(); // 触发数字换行重新渲染
    }

    // 保留手动点击切换功能
    function toggleOrientation() {
      isLogicalPortrait = !isLogicalPortrait;
      applyOrientationLogic();
    }

    function initDOM() {
      var slotsHtml = '';
      for (var i = 0; i < TOTAL_SLOTS; i++) { slotsHtml += '<div class="track-slot"></div>'; }
      els.tracksBottom.innerHTML = slotsHtml;
      trackSlots = els.tracksBottom.querySelectorAll('.track-slot');
      els.btnToggle.innerHTML = ICON_PLAY;
    }

    function bindEvents() {
      document.getElementById('btn-orientation').addEventListener('click', toggleOrientation);
      document.getElementById('btn-font-switch').addEventListener('click', switchFont);
      
      els.btnToggle.addEventListener('click', function(e) {
        if (e) e.preventDefault();
        toggleTimer();
        this.blur();
      });
      
      var adjustBtns = document.querySelectorAll('.btn-adjust');
      for (var m = 0; m < adjustBtns.length; m++) {
        adjustBtns[m].addEventListener('click', function(e) {
          addMinutes(parseInt(e.target.getAttribute('data-adj'), 10));
          e.target.blur();
        });
      }
    }

    function initSavedSettings() {
      applyOrientationLogic(); // 初始化正确姿态
      try {
        var savedFont = localStorage.getItem('kindle_pomodoro_font');
        if (savedFont !== null) { currentFontIndex = parseInt(savedFont, 10) % TOTAL_FONTS || 0; }
      } catch (e) {}
      applyFont();
    }

    function switchFont() {
      currentFontIndex = (currentFontIndex + 1) % TOTAL_FONTS;
      try { localStorage.setItem('kindle_pomodoro_font', currentFontIndex); } catch(e) {}
      applyFont();
    }

    function applyFont() {
      els.timerText.className = 'timer-text font-style-' + currentFontIndex;
    }

    function toggleTimer() {
      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      } else { 
        if (timeLeft <= 0 || !hasStarted) {
          timeLeft = totalTime;
          startAnimalTracks();
        }
        updateDayNightMode();
        targetEndTime = new Date().getTime() + (timeLeft * 1000);
        timerId = setInterval(tick, 1000);
        els.btnToggle.innerHTML = ICON_PAUSE;
      }
    }

    function tick() {
      var now = new Date().getTime();
      var newTimeLeft = Math.max(0, Math.ceil((targetEndTime - now) / 1000));
      
      if (newTimeLeft !== timeLeft) { 
        timeLeft = newTimeLeft;
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          els.btnToggle.innerHTML = ICON_PLAY;
          timeLeft = totalTime;
          clearTracks();
          updateDisplay();
        }
      }
    }

    function addMinutes(mins) {
      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      }
      var currentMins = Math.round(totalTime / 60) + mins;
      if (currentMins > 120) { currentMins = 5; } else if (currentMins < 5) { currentMins = 120; }
      totalTime = currentMins * 60;
      timeLeft = totalTime;
      clearTracks();
      updateDayNightMode();
      updateDisplay();
    }

    /* ====================================================
       2. 时钟双行渲染逻辑 
       ==================================================== */
    function updateDisplay() {
      var totalMinutes = Math.ceil(timeLeft / 60);
      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;
      
      var strH = (hours < 10 ? '0' : '') + hours;
      var strM = (mins < 10 ? '0' : '') + mins;
      
      // 判断当前是不是逻辑竖屏，如果是竖屏则去掉冒号，用 <br> 断行
      var newText = isLogicalPortrait ? (strH + '<br>' + strM) : (strH + ':' + strM);

      if (newText !== lastDisplayedText) {
        els.timerText.innerHTML = newText; // 使用 innerHTML 使 <br> 标签生效
        lastDisplayedText = newText;
      }
      
      if (!hasStarted || !currentAnimal) return;
      var progressRatio = (totalTime - timeLeft) / totalTime;
      var leadIndex = Math.min(TOTAL_SLOTS - 1, Math.floor(progressRatio * TOTAL_SLOTS));

      if (leadIndex === lastLeadIndex) return;
      lastLeadIndex = leadIndex;

      var count = currentAnimal.feetCount;
      for (var i = 0; i < trackSlots.length; i++) { trackSlots[i].className = 'track-slot'; }
      for (var k = 0; k < count; k++) {
        var pos = leadIndex - k;
        if (pos >= 0 && pos < TOTAL_SLOTS) { trackSlots[pos].className = 'track-slot active'; }
      }
    }

    function updateDayNightMode() {
      var hour = new Date().getHours();
      isDayTime = (hour >= 6 && hour < 18);
      els.sunBox.style.display = isDayTime ? 'block' : 'none';
      els.moonBox.style.display = isDayTime ? 'none' : 'block';
    }

    function startAnimalTracks() {
      var randIndex = Math.floor(Math.random() * ANIMALS.length);
      currentAnimal = ANIMALS[randIndex];
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = currentAnimal.svg;
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = true;
      lastLeadIndex = -1;
      updateDisplay();
    }

    function clearTracks() {
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = '';
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = false;
      lastLeadIndex = -1;
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
