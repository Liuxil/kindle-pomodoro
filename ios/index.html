<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="番茄钟">
  <link rel="preload" as="image" href="/ios/icon.png">
  <link rel="apple-touch-icon" href="/ios/icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/ios/manifest.json">
  <title>Pomodoro</title>

  <style>
    :root {
      --ink: #000000;
      --bg: #ffffff;
    }
    /* 夜间/暗色模式 */
    body.night-mode {
      --ink: #E0E0E0;
      --bg: #121212;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      overflow: hidden !important;
      background-color: var(--bg);
      color: var(--ink);
      font-family: sans-serif;
      transition: background-color 0.25s ease;
    }
    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

    #launch-splash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #launch-splash img {
      width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .launch-splash-title {
      margin-top: 14px; font-size: 15px; color: #000000; font-weight: 600;
      letter-spacing: 1px;
    }
    #launch-splash.hide {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    #screen-bounds {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden !important;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }

    #safe-area {
      position: relative;
      width: 100%; height: 100%;
    }

    #app-container {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      transition: transform 0.3s ease-out, width 0.3s, height 0.3s;
    }

    .sky-badge { width: 60px; height: 60px; position: relative; cursor: pointer; flex-shrink: 0; }
    .sun-box, .moon-box { width: 100%; height: 100%; position: relative; display: none; }

    .main-section {
      width: 100%; flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .timer-container {
      width: 100%; cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .timer-text {
      line-height: 1;
      margin: -15px 0; 
      text-align: center;
      width: 100%;
      display: block;
      white-space: nowrap;
    }

    .portrait-format .timer-text {
      line-height: 0.85; 
      margin: 0;
      white-space: normal;
    }

    /* ================= 4种字体样式配置 ================= */
    
    /* 0: 像素字体 (SVG) */
    .font-style-0 { 
      color: var(--ink) !important; 
      font-size: 250px; /* 横屏字号 */
    }
    .portrait-format .font-style-0 { font-size: 245px; } /* 竖屏放大 30% */

    /* 1: 7段液晶字体 (SVG) */
    .font-style-1 { 
      color: var(--ink) !important; 
      font-size: 250px;
    }
    .portrait-format .font-style-1 { font-size: 245px; }

    /* 2: 苹果实心粗体 (基准) */
    .font-style-2 { 
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
      font-weight: 900; 
      color: var(--ink) !important; 
      -webkit-text-fill-color: var(--ink) !important; 
      -webkit-text-stroke: 0 !important; 
      letter-spacing: -6px; 
      font-size: 250px;
    }
    .portrait-format .font-style-2 { font-size: 245px; letter-spacing: -2px; }

    /* 3: 苹果空心粗体 */
    .font-style-3 { 
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
      font-weight: 900; 
      color: transparent !important; 
      -webkit-text-fill-color: transparent !important; 
      -webkit-text-stroke: 4px var(--ink) !important; 
      letter-spacing: -6px; 
      font-size: 250px;
    }
    .portrait-format .font-style-3 { font-size: 245px; letter-spacing: -2px; -webkit-text-stroke: 3px var(--ink) !important; }

    /* ================= 轨道及按钮配置 ================= */
    .tracks-container {
      width: 96%; height: 26px; margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-slot { width: 20px; height: 20px; display: flex; justify-content: center; align-items: center; }
    .track-slot svg { width: 18px; height: 18px; fill: var(--ink); display: none; }
    .track-slot:nth-child(even) svg { margin-top: 4px; transform: rotate(6deg); }
    .track-slot:nth-child(odd) svg { margin-top: -4px; transform: rotate(-6deg); }
    .track-slot.active svg { display: block; }

    .footer {
      width: 94%; flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-adjust-group { display: flex; gap: 10px; }
    button {
      background: var(--bg); color: var(--ink); border: 3px solid var(--ink); font-weight: bold; border-radius: 8px; cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: var(--ink); color: var(--bg); }
    .btn-adjust { font-size: 18px; padding: 5px 14px; }
    
    .btn-start {
      background: transparent !important; border: none !important; padding: 5px; width: 72px; height: 72px;
      display: flex; justify-content: center; align-items: center;
    }
    .btn-start:active { background: transparent !important; color: var(--ink) !important; opacity: 0.4; }
    .btn-start svg { width: 42px; height: 42px; }

    .rest-screen, .standby-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; cursor: pointer;
      justify-content: center; align-items: center;
    }
    .rest-screen.active, .standby-screen.active { display: flex; }
    .standby-screen { z-index: 90; flex-direction: column; }
    .rest-panel { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; }
    .rest-panel.active { display: flex; }
    
    .pixel-stage, .pixel-cat-stage { width: 280px; height: 280px; position: relative; }
    .anim-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .anim-frame, .cat-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .anim-frame.active, .cat-frame.active { display: block; }
  </style>
</head>

      </div>
    </div>
  </div>

  <script>
    var ICON_PLAY = '<svg viewBox="0 0 16 16" style="shape-rendering: crispEdges;"><rect x="4" y="2" width="2" height="12" fill="var(--ink)"/><rect x="6" y="3" width="2" height="10" fill="var(--ink)"/><rect x="8" y="4" width="2" height="8" fill="var(--ink)"/><rect x="10" y="5" width="2" height="6" fill="var(--ink)"/><rect x="12" y="6" width="2" height="4" fill="var(--ink)"/><rect x="14" y="7" width="2" height="2" fill="var(--ink)"/></svg>';
    var ICON_PAUSE = '<svg viewBox="0 0 16 16" style="shape-rendering: crispEdges;"><rect x="3" y="2" width="4" height="12" fill="var(--ink)"/><rect x="9" y="2" width="4" height="12" fill="var(--ink)"/></svg>';

    var ANIMALS = [
      { feetCount: 4, svg: '<svg viewBox="0 0 24 24"><ellipse cx="9" cy="12" rx="4.5" ry="5.5"/><circle cx="16" cy="7" r="2"/><circle cx="19" cy="12" r="2.2"/><circle cx="16" cy="17" r="2"/></svg>' },
      { feetCount: 2, svg: '<svg viewBox="0 0 24 24"><path d="M5 12 L19 12 M13 12 L19 6 M13 12 L19 18" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
    ];

    /* ========================================================= 
       SVG 矢量渲染矩阵
       ========================================================= */
    var PIXEL_FONT = {
      '0': { w: 6, d: ["011110","110011","110011","110011","110011","110011","110011","011110"] },
      '1': { w: 4, d: ["0011","0111","1111","0011","0011","0011","0011","1111"] },
      '2': { w: 6, d: ["011110","110011","000011","000110","001100","011000","110000","111111"] },
      '3': { w: 6, d: ["011110","110011","000011","001110","000011","000011","110011","011110"] },
      '4': { w: 6, d: ["000011","000111","001111","011011","110011","111111","000011","000011"] },
      '5': { w: 6, d: ["111111","110000","111110","000011","000011","000011","110011","011110"] },
      '6': { w: 6, d: ["001111","011000","110000","111110","110011","110011","110011","011110"] },
      '7': { w: 6, d: ["111111","110011","000011","000110","001100","011000","011000","011000"] },
      '8': { w: 6, d: ["011110","110011","110011","011110","110011","110011","110011","011110"] },
      '9': { w: 6, d: ["011110","110011","110011","110011","011111","000011","000110","111100"] },
      ':': { w: 2, d: ["00","11","11","00","00","11","11","00"] }
    };

    var LCD_SEGMENTS = {
      'A': "M 2.45 0 L 7.55 0 L 8.4 1 L 7.55 2 L 2.45 2 L 1.6 1 Z",
      'B': "M 9 1.6 L 10 2.45 L 10 7.55 L 9 8.4 L 8 7.55 L 8 2.45 Z",
      'C': "M 9 9.6 L 10 10.4 L 10 15.6 L 9 16.4 L 8 15.6 L 8 10.4 Z",
      'D': "M 2.45 16 L 7.55 16 L 8.4 17 L 7.55 18 L 2.45 18 L 1.6 17 Z",
      'E': "M 1 9.6 L 2 10.4 L 2 15.6 L 1 16.4 L 0 15.6 L 0 10.4 Z",
      'F': "M 1 1.6 L 2 2.45 L 2 7.55 L 1 8.4 L 0 7.55 L 0 2.45 Z",
      'G': "M 2.45 8 L 7.55 8 L 8.4 9 L 7.55 10 L 2.45 10 L 1.6 9 Z"
    };
    var LCD_DIGIT_MAP = {
      '0': ['A','B','C','D','E','F'], '1': ['B','C'], '2': ['A','B','G','E','D'],
      '3': ['A','B','C','D','G'], '4': ['F','B','G','C'], '5': ['A','F','G','C','D'],
      '6': ['A','F','E','D','C','G'], '7': ['A','B','C'], '8': ['A','B','C','D','E','F','G'],
      '9': ['A','B','C','D','F','G']
    };

    var TOTAL_SLOTS = 16;
    var TOTAL_FONTS = 4;
    var SKY_INTERVAL = 1;

    var totalTime = 25 * 60;
    var timeLeft = totalTime;
    var targetEndTime = null;
    var timerId = null;
    var hasStarted = false;
    
    var isDayTime = true;
    var starToggled = false;
    var currentAnimal = null;
    var currentFontIndex = 0; 

    var isPhysicalPortrait = true;

    var easterEggStep = 0;
    var IDLE_TIMEOUT_MS = 60000;
    var idleTimer = null;
    var standbyAnimTimer = null;
    var standbyCatStep = 0;
    
    var REST_ANIM_INTERVALS = [1000, 180, 1800]; 
    var restAnimState = { timer: null, index: 0, birdStep: 0, comboStep: 0, catStep: 0 };

    var els = {
      appContainer: document.getElementById('app-container'),
      timerText: document.getElementById('timer-text'),
      btnToggle: document.getElementById('btn-toggle'),
      restScreen: document.getElementById('rest-screen'),
      sunBox: document.getElementById('sun-box'),
      moonBox: document.getElementById('moon-box'),
      tracksBottom: document.getElementById('tracks-bottom'),
      standbyScreen: document.getElementById('standby-screen')
    };

    var trackSlots = [];
    var lastDisplayedText = '';
    var lastLeadIndex = -1;

    function init() {
      initOrientation();
      initDOM();
      initSavedSettings();
      updateDayNightMode();
      clearTracks();
      updateDisplay();
      bindEvents();
      resetIdleTimer();
      initWakeLock();
      hideLaunchSplash();
    }

    function hideLaunchSplash() {
      var splash = document.getElementById('launch-splash');
      if (!splash) return;
      // 加一点点延迟再淡出，避免刚画完启动图立刻就消失、显得一闪而过
      setTimeout(function () {
        splash.className = 'hide';
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }, 200);
    }

    function initWakeLock() {
      requestWakeLock();
      // 页面切到后台(切App/锁屏/切标签页)时释放常亮锁；回到前台时重新申请。
      // Wake Lock在页面不可见时会被系统自动释放，这里同步一下我们自己的状态，
      // 并在重新可见时主动补回来。
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          requestWakeLock();
        } else {
          releaseWakeLock();
        }
      });
    }

    var wakeLock = null;

    function requestWakeLock() {
      if (!('wakeLock' in navigator)) return; // 不支持则静默跳过，不影响其他功能
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {
        // 常见于低电量模式或权限限制，静默失败即可
      });
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function initOrientation() {
      var mql = window.matchMedia("(orientation: portrait)");
      isPhysicalPortrait = mql.matches;
      applyOrientationLogic();

      mql.addEventListener("change", function(e) {
        isPhysicalPortrait = e.matches;
        applyOrientationLogic();
      });
    }

    function applyOrientationLogic() {
      if (isPhysicalPortrait) {
        els.appContainer.classList.add("portrait-format");
      } else {
        els.appContainer.classList.remove("portrait-format");
      }
      updateDisplay();
    }

    function initDOM() {
      var slotsHtml = '';
      for (var i = 0; i < TOTAL_SLOTS; i++) { slotsHtml += '<div class="track-slot"></div>'; }
      els.tracksBottom.innerHTML = slotsHtml;
      trackSlots = els.tracksBottom.querySelectorAll('.track-slot');
      els.btnToggle.innerHTML = ICON_PLAY;

      els.restPanels = [document.getElementById('rest-panel-0'), document.getElementById('rest-panel-1'), document.getElementById('rest-panel-2')];
      els.birdFrames = document.getElementById('stage-bird-coffee').querySelectorAll('.anim-frame');
      els.flowerFrames = document.getElementById('flower-layer').querySelectorAll('.anim-frame');
      els.butterflyFrames = document.getElementById('butterfly-layer').querySelectorAll('.anim-frame');
      els.cats = [document.getElementById('cat-p0'), document.getElementById('cat-p1')];
      els.standbyCats = [document.getElementById('standby-cat-p0'), document.getElementById('standby-cat-p1')];
    }

    function bindEvents() {
      document.getElementById('btn-display-mode').addEventListener('click', toggleDisplayMode);
      document.getElementById('btn-font-switch').addEventListener('click', switchFont);
      
      els.btnToggle.addEventListener('click', function(e) {
        if (e) e.preventDefault();
        toggleTimer();
        this.blur();
      });
      
      var adjustBtns = document.querySelectorAll('.btn-adjust');
      for (var m = 0; m < adjustBtns.length; m++) {
        adjustBtns[m].addEventListener('click', function(e) {
          addMinutes(parseInt(e.target.getAttribute('data-adj'), 10));
          e.target.blur();
        });
      }

      els.restScreen.addEventListener('click', hideRestScreen);
      els.standbyScreen.addEventListener('click', hideStandbyScreen);
      document.addEventListener('click', resetIdleTimer, true);
    }

    function handleEasterEgg(action) {
      if (action === 'FONT') {
        if (easterEggStep === 0 || easterEggStep === 1) { easterEggStep++; } else { easterEggStep = 2; }
      } else if (action === '+10') {
        if (easterEggStep === 2) { easterEggStep = 3; } else if (easterEggStep === 3) { easterEggStep = 4; } else { easterEggStep = 0; }
      } else if (action === '+5') {
        if (easterEggStep === 4) { easterEggStep = 5; } else if (easterEggStep === 6) { easterEggStep = 7; } else { easterEggStep = 0; }
      } else if (action === '-5') {
        if (easterEggStep === 5) { easterEggStep = 6; } else if (easterEggStep === 7) { easterEggStep = 0; return true; } else { easterEggStep = 0; }
      } else {
        easterEggStep = 0;
      }
      return false;
    }

    function syncThemeColor() {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      var isNight = document.body.classList.contains('night-mode');
      meta.setAttribute('content', isNight ? '#121212' : '#ffffff');
    }

    function initSavedSettings() {
      applyOrientationLogic(); 
      try {
        var savedFont = localStorage.getItem('pomodoro_font');
        if (savedFont !== null) { currentFontIndex = parseInt(savedFont, 10) % TOTAL_FONTS || 0; }
      } catch (e) {}
      applyFont();

      try {
        var savedMode = localStorage.getItem('pomodoro_display_mode');
        if (savedMode === 'night') { document.body.classList.add('night-mode'); }
      } catch (e) {}
      syncThemeColor();
      forceIOSRepaint();
    }

    function toggleDisplayMode() {
      document.body.classList.toggle('night-mode');
      var mode = document.body.classList.contains('night-mode') ? 'night' : 'day';
      try { localStorage.setItem('pomodoro_display_mode', mode); } catch (e) {}
      syncThemeColor();
      updateDayNightMode();
      forceIOSRepaint();
    }

    function forceIOSRepaint() {
      // 模拟"旋转屏幕"这个动作附带触发的强制重绘/重新合成效果，
      // 不需要用户真的转一下设备。几种常见手段一起上，做双保险：
      // 1. 滚动一下再归零，强制触发一次布局计算
      window.scrollTo(0, 1);
      window.scrollTo(0, 0);
      // 2. 短暂给body加一个transform，强制它单独成为一个合成层再撤销，
      //    这个动作通常会让WebKit重新合成整个页面(包括状态栏区域)
      document.body.style.webkitTransform = 'translateZ(0)';
      void document.body.offsetHeight; // 强制同步读取一次布局，逼浏览器立刻算完，不能拖到下一帧
      requestAnimationFrame(function () {
        document.body.style.webkitTransform = '';
      });
    }

    function switchFont() {
      currentFontIndex = (currentFontIndex + 1) % TOTAL_FONTS;
      try { localStorage.setItem('pomodoro_font', currentFontIndex); } catch(e) {}
      applyFont();
      handleEasterEgg('FONT');
    }

    function applyFont() {
      els.timerText.className = 'timer-text font-style-' + currentFontIndex;
      lastDisplayedText = ''; 
      updateDisplay();
    }

    function toggleTimer() {
      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      } else { 
        if (timeLeft <= 0 || !hasStarted) {
          timeLeft = totalTime;
          startAnimalTracks();
        }
        updateDayNightMode();
        targetEndTime = new Date().getTime() + (timeLeft * 1000);
        timerId = setInterval(tick, 1000);
        els.btnToggle.innerHTML = ICON_PAUSE;
      }
    }

    function tick() {
      var now = new Date().getTime();
      var newTimeLeft = Math.max(0, Math.ceil((targetEndTime - now) / 1000));
      
      if (newTimeLeft !== timeLeft) { 
        var elapsedSeconds = totalTime - newTimeLeft;
        timeLeft = newTimeLeft;
        
        if (elapsedSeconds % SKY_INTERVAL === 0) tickSkyBadge();
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          els.btnToggle.innerHTML = ICON_PLAY;
          timeLeft = totalTime;
          clearTracks();
          updateDisplay();
          showRestScreen(); 
        }
      }
    }

    function tickSkyBadge() {
      starToggled = !starToggled;
      if (isDayTime) {
        var sunExt = document.getElementById('sun-rays-ext');
        if (sunExt) sunExt.style.display = starToggled ? 'block' : 'none';
      } else {
        var mStar1 = document.getElementById('moon-stars-1');
        var mStar2 = document.getElementById('moon-stars-2');
        if (mStar1 && mStar2) {
          mStar1.style.display = starToggled ? 'block' : 'none';
          mStar2.style.display = starToggled ? 'none' : 'block';
        }
      }
    }

    function addMinutes(mins) {
      var actionStr = (mins > 0 ? '+' : '') + mins;
      var isEggTriggered = handleEasterEgg(actionStr);

      if (timerId) { 
        clearInterval(timerId);
        timerId = null;
        els.btnToggle.innerHTML = ICON_PLAY;
      }
      var currentMins = Math.round(totalTime / 60) + mins;
      if (currentMins > 120) { currentMins = 5; } else if (currentMins < 5) { currentMins = 120; }
      totalTime = currentMins * 60;
      timeLeft = totalTime;
      clearTracks();
      updateDayNightMode();
      updateDisplay();
      
      if (isEggTriggered) showRestScreen();
    }

    function textToSVG(lines, type) {
      var svgContent = '';
      var maxWidth = 0;
      var lineData = [];
      
      for (var l = 0; l < lines.length; l++) {
        var w = 0;
        var line = lines[l];
        for (var i = 0; i < line.length; i++) {
          if (type === 'pixel') {
            w += (PIXEL_FONT[line[i]] ? PIXEL_FONT[line[i]].w : 0) + 1;
          } else {
            w += (line[i] === ':' ? 4 : 10) + 2;
          }
        }
        w -= (type === 'pixel' ? 1 : 2); 
        lineData.push({ text: line, width: w });
        if (w > maxWidth) maxWidth = w;
      }
      
      var currentY = 0;
      for (var l = 0; l < lineData.length; l++) {
        var startX = (maxWidth - lineData[l].width) / 2; 
        var currentX = startX;
        var line = lineData[l].text;
        
        for (var i = 0; i < line.length; i++) {
          var char = line[i];
          if (type === 'pixel') {
            var glyph = PIXEL_FONT[char];
            if (glyph) {
              for (var r = 0; r < glyph.d.length; r++) {
                for (var c = 0; c < glyph.w; c++) {
                  if (glyph.d[r][c] === '1') {
                    svgContent += '<rect x="'+(currentX + c)+'" y="'+(currentY + r)+'" width="1" height="1" />';
                  }
                }
              }
              currentX += glyph.w + 1;
            }
          } else {
            if (char === ':') {
              svgContent += '<path d="M '+(currentX+1)+' '+(currentY+5)+' h 2 v 2 h -2 Z M '+(currentX+1)+' '+(currentY+11)+' h 2 v 2 h -2 Z" />';
              currentX += 4 + 2;
            } else {
              var segs = LCD_DIGIT_MAP[char] || [];
              for(var s = 0; s < segs.length; s++) {
                svgContent += '<path transform="translate('+currentX+','+currentY+')" d="'+LCD_SEGMENTS[segs[s]]+'" />';
              }
              currentX += 10 + 2;
            }
          }
        }
        currentY += (type === 'pixel' ? 9.5 : 20.5); 
      }
      
      var h = currentY - (type === 'pixel' ? 1.5 : 2.5);
      var shapeRender = type === 'pixel' ? 'crispEdges' : 'auto';
      
      // 数字字形本身(不含行距)的高度，单位与viewBox一致：像素字8行，7段字形从y=0到y=17
      var glyphUnitH = type === 'pixel' ? 8 : 17;
      // 目标：数字视觉高度 = 0.71 × font-size，这个比例是用fontTools实测
      // Liberation Sans Bold(与Helvetica/Arial度量兼容)的数字'0'实际高度算出来的，
      // 用来对齐font-style-2(苹果实心粗体)的视觉大小
      var TARGET_DIGIT_RATIO = 0.71;
      var heightScale = (TARGET_DIGIT_RATIO * h / glyphUnitH) + 'em';

      // 7段式增加微小描边使其更饱满，与苹果实心字基准对齐
      var strokeStyle = type === 'lcd' ? 'stroke="currentColor" stroke-width="0.3" stroke-linejoin="round"' : '';
      
      return '<svg viewBox="0 0 ' + maxWidth + ' ' + h + '" style="height: ' + heightScale + '; width: auto; display: inline-block; fill: currentColor; shape-rendering: ' + shapeRender + ';" ' + strokeStyle + '>' + svgContent + '</svg>';
    }

    function updateDisplay() {
      var totalMinutes = Math.ceil(timeLeft / 60);
      var hours = Math.floor(totalMinutes / 60);
      var mins = totalMinutes % 60;
      
      var strH = (hours < 10 ? '0' : '') + hours;
      var strM = (mins < 10 ? '0' : '') + mins;
      
      var newText;
      var arrLines = isPhysicalPortrait ? [strH, strM] : [strH + ':' + strM];

      if (currentFontIndex === 0) {
        newText = textToSVG(arrLines, 'pixel');
      } else if (currentFontIndex === 1) {
        newText = textToSVG(arrLines, 'lcd');
      } else {
        newText = isPhysicalPortrait ? (strH + '<br>' + strM) : (strH + ':' + strM);
      }

      if (newText !== lastDisplayedText) {
        els.timerText.innerHTML = newText;
        lastDisplayedText = newText;
      }
      
      if (!hasStarted || !currentAnimal) return;
      var progressRatio = (totalTime - timeLeft) / totalTime;
      var leadIndex = Math.min(TOTAL_SLOTS - 1, Math.floor(progressRatio * TOTAL_SLOTS));

      if (leadIndex === lastLeadIndex) return;
      lastLeadIndex = leadIndex;

      var count = currentAnimal.feetCount;
      for (var i = 0; i < trackSlots.length; i++) { trackSlots[i].className = 'track-slot'; }
      for (var k = 0; k < count; k++) {
        var pos = leadIndex - k;
        if (pos >= 0 && pos < TOTAL_SLOTS) { trackSlots[pos].className = 'track-slot active'; }
      }
    }

    function updateDayNightMode() {
      // 不再按真实时钟判断，直接跟随当前的显示模式：夜间模式=月亮，白天模式=太阳
      isDayTime = !document.body.classList.contains('night-mode');
      els.sunBox.style.display = isDayTime ? 'block' : 'none';
      els.moonBox.style.display = isDayTime ? 'none' : 'block';
    }

    function startAnimalTracks() {
      var randIndex = Math.floor(Math.random() * ANIMALS.length);
      currentAnimal = ANIMALS[randIndex];
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = currentAnimal.svg;
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = true;
      lastLeadIndex = -1;
      updateDisplay();
    }

    function clearTracks() {
      for (var i = 0; i < trackSlots.length; i++) {
        trackSlots[i].innerHTML = '';
        trackSlots[i].className = 'track-slot';
      }
      hasStarted = false;
      lastLeadIndex = -1;
    }

    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        if (!hasStarted && els.restScreen.className.indexOf('active') === -1 && els.standbyScreen.className.indexOf('active') === -1) {
          showStandbyScreen();
        }
      }, IDLE_TIMEOUT_MS);
    }

    function showStandbyScreen() {
      standbyCatStep = 0;
      els.standbyCats[0].className = 'cat-frame active';
      els.standbyCats[1].className = 'cat-frame';
      els.standbyScreen.className = 'standby-screen active';

      if (standbyAnimTimer) clearInterval(standbyAnimTimer);
      standbyAnimTimer = setInterval(function() {
        standbyCatStep = 1 - standbyCatStep;
        els.standbyCats[0].className = standbyCatStep === 0 ? 'cat-frame active' : 'cat-frame';
        els.standbyCats[1].className = standbyCatStep === 1 ? 'cat-frame active' : 'cat-frame';
      }, 1800); 
    }

    function hideStandbyScreen(e) {
      if (e) e.stopPropagation();
      els.standbyScreen.className = 'standby-screen';
      if (standbyAnimTimer) { clearInterval(standbyAnimTimer); standbyAnimTimer = null; }
      resetIdleTimer();
    }

    function showRestScreen() {
      restAnimState.index = Math.floor(Math.random() * els.restPanels.length);
      updateActiveRestPanel();
      els.restScreen.className = 'rest-screen active';

      if (restAnimState.timer) clearInterval(restAnimState.timer);
      restAnimState.timer = setInterval(animateRestPanel, REST_ANIM_INTERVALS[restAnimState.index]);
    }

    function hideRestScreen(e) {
      if (e) e.stopPropagation();
      els.restScreen.className = 'rest-screen';
      if (restAnimState.timer) clearInterval(restAnimState.timer);
    }

    function updateActiveRestPanel() {
      for (var i = 0; i < els.restPanels.length; i++) {
        els.restPanels[i].className = (i === restAnimState.index) ? 'rest-panel active' : 'rest-panel';
      }
    }

    function animateRestPanel() {
      if (els.restScreen.className.indexOf('active') === -1) return;

      var idx = restAnimState.index;
      if (idx === 0) {
        els.birdFrames[restAnimState.birdStep].className = 'anim-frame';
        restAnimState.birdStep = (restAnimState.birdStep + 1) % 4;
        els.birdFrames[restAnimState.birdStep].className = 'anim-frame active';
      } else if (idx === 1) {
        var bLen = els.butterflyFrames.length;
        var fLen = els.flowerFrames.length;
        els.butterflyFrames[restAnimState.comboStep % bLen].className = 'anim-frame';
        els.flowerFrames[Math.floor(restAnimState.comboStep / 4) % fLen].className = 'anim-frame';
        
        restAnimState.comboStep++;
        if (restAnimState.comboStep >= 3200) restAnimState.comboStep = 0;
        
        els.butterflyFrames[restAnimState.comboStep % bLen].className = 'anim-frame active';
        els.flowerFrames[Math.floor(restAnimState.comboStep / 4) % fLen].className = 'anim-frame active';
      } else if (idx === 2) {
        restAnimState.catStep = 1 - restAnimState.catStep;
        els.cats[0].className = restAnimState.catStep === 0 ? 'cat-frame active' : 'cat-frame';
        els.cats[1].className = restAnimState.catStep === 1 ? 'cat-frame active' : 'cat-frame';
      }
    }

    window.addEventListener('load', init);

    // 注册Service Worker：第一次打开走网络，之后每次从主屏幕图标打开
    // 能直接读本地缓存秒开，不用再等一遍完整的网络请求
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/ios/sw.js').catch(function () {
          // 注册失败不影响正常使用，静默即可
        });
      });
    }
  </script>
</body>
</html>
